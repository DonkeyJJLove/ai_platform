function table(p,cols,rows){
 const box=add(p,node('div','tablewrap')),tab=add(box,node('table'));
 const thead=add(add(tab,node('thead')),node('tr'));
 for(const col of cols)add(thead,node('th','',col[0]));

 for(const item of rows){
  const row=add(tbody,node('tr'));
  for(const col of cols)add(row,node('td','',col[1](item)??'—'));
 }
 return box;
}
function cards(p,items){
 const wrap=add(p,node('div','cards'));
 for(const [key,val,desc] of items){
  const c=add(wrap,node('div','card'));
  add(c,node('div','key',key));add(c,node('div','value',val));
  add(c,node('div','desc',desc));
 }

  ['Provider','NOT_ATTESTED','Nie przyznaje authority'],
 ]);

 text(explain,'Źródło '+safeValue(observedFleet.source||'STORED_SNAPSHOT_NOT_LIVE_DOCKER')+

  ' · '+safeValue(observedFleet.currentness)+' · ready '+safeValue(observedFleet.ready)+
  '/'+safeValue(observedFleet.materialized)+
  ' · provider/admission NIEPOTWIERDZONE'+(observedFleet.reason?' · '+observedFleet.reason:''));
 table(explain,[['Worker',w=>w.worker_id||w.name],['Kontener',w=>w.container_state||w.state],

];
function renderMachines(p){
 cards(p,[['Fizyczne domeny','1','Wspólna domena Windows-MOON'],['Środowiska w mapie',machines.length,'1 fizyczny + 4 logiczne'],['Wersja obserwacji','MIXED','role historyczne, endpointy live']]);
 const s=panel(p,'Maszyny, środowiska i ich funkcje');
 table(s,[['Tożsamość',x=>x.id],['Klasa',x=>x.type],['Funkcja',x=>x.role],['Domena fizyczna',x=>x.domain],['Dowód',x=>x.status]],machines);
 add(s,node('div','notice','MOON, LAB-DEBIAN, LAB-UBUNTU i LION-AUTH-LAB są odrębnymi tożsamościami logicznymi WSL. Nie dowodzą czterech niezależnych domen awarii. Źródło ról: docs/HOSTS_AND_LABS.md; stan live tylko przy wskazanych endpointach.'));
}
function renderRepositories(p){
 const rs=live()?.repos?.repositories||snapshot.federation.repositories;
 const s=panel(p,'Federacja — zapisane HEAD-y (nie live GitHub)');
 const filter=add(s,node('input'));filter.type='search';filter.placeholder='Znajdź repozytorium';
 text(s,'STORED_GITHUB_HEADS_NOT_LIVE · HEAD-y ze snapshotu '+safeValue(live()?.repos?.snapshot_at||snapshot.generated_at)+
 ' · pobierz świeży Git-currentness przed consequential effect.');
 const holder=add(s,node('div'));holder.style.marginTop='10px';
 function draw(){
  holder.replaceChildren();
  const keep=rs.filter(x=>String(x.name).toLowerCase().includes(filter.value.trim().toLowerCase()));
  table(holder,[['Repozytorium',x=>x.name],['Gałąź',x=>x.branch],
    ['HEAD',x=>x.head_sha],['Źródło',x=>x.ref_source||'STORED_SOURCE']],keep);
 }
 filter.addEventListener('input',draw);draw();
}
function renderDependencies(p){
 const links=[
  ['WINDOWS-MOON','Local GPT 8772','Natywny model','HTTP health; model inference/mission binding osobne'],
  ['WINDOWS-MOON','LPCL Panel 8780','Kanoniczny Model Chat','Właściciel rozmów/binding'],
  ['LION-AUTH-LAB','Mission Control 8766','Misje i phase contracts','Brak drivera w REGISTERED pilot ≠ workery wykonują'],
  ['MOON WSL','Docker MD 32','Flota materialna','Carrier READY ≠ runtime admission'],
  ['LAB-DEBIAN','LAB-UBUNTU','Producer / verifier','Role logiczne, test E2E nieudowodniony'],
  ['ChatGPT SaaS','Canonical broker','Zewnętrzny handoff','PENDING_HANDOFF ≠ RECEIPT_RECONCILED']
 ];
 const s=panel(p,'Funkcjonalne zależności');
 table(s,[['Producent',x=>x[0]],['Odbiorca',x=>x[1]],['Funkcja',x=>x[2]],['Granica dowodu',x=>x[3]]],links);
 add(s,node('div','notice','Źródłowa mapa nie jest runtime topology atestation. Statusy są rozdzielone: źródło, health, binding, authority, material effect, receipt i weryfikacja.'));
}
function render(){
 const content=$('content');content.replaceChildren();
 $('provenance').textContent=(mode==='cluster'?'CLUSTER / MOON material execution':'SYSTEM / hosts + federation')+
  ' · source snapshot '+snapshot.generated_at+
  ' · live '+(live()?live().observed_at:'UNAVAILABLE')+' · authority NONE';
 if(mode==='cluster'){
  ({overview:renderOverview,workers:renderWorkers,logs:renderLogs,artifacts:renderArtifacts})[active](content);
 }else{
  ({machines:renderMachines,repositories:renderRepositories,dependencies:renderDependencies})[active](content);
 }
 const nav=$('subnav');nav.replaceChildren();
 for(const [key,label] of subtabs){
  const button=add(nav,node('button',key===active?'active':'',label));
  button.type='button';button.setAttribute('aria-current',key===active?'page':'false');
  button.addEventListener('click',()=>{active=key;render()});
 }
}
async function refreshLive(){
 if(busy)return;
 busy=true;$('refresh').disabled=true;
 try{
  if(!window.lionObserver)throw Error('READ_MODEL_PRELOAD_MISSING');
  const value=await window.lionObserver.snapshot();
  if(value?.schema!=='lion.operator-read-model/v1'||value.authority_effect!=='NONE')
   throw Error('READ_MODEL_PROVENANCE_MISMATCH');
  current=value;
  $('freshness').textContent='Odczyt '+value.observed_at+
   ' · '+value.data_class+' · CURRENTNESS depends on each source; no authority.';
 }catch(error){
  $('freshness').textContent='Bieżący read-model niedostępny: '+
   String(error?.message||error).slice(0,120)+'; wyświetlany snapshot jest historyczny.';
 }finally{
  busy=false;$('refresh').disabled=false;render();
 }
}
$('modeTitle').textContent=mode==='cluster'?'LION CLUSTER — wykonawcy i dowody':'LION SYSTEM — maszyny i architektura';
$('modeSubtitle').textContent=mode==='cluster'
 ?'Material MD / MAT, logi i artefakty; bez przeskakiwania do SYSTEM'
 :'Środowiska, funkcje, fizyczne domeny, federacja i zależności; bez przeskakiwania do CLUSTER';
$('refreshTitle').textContent='Odczyt kanoniczny — '+(mode==='cluster'?'wykonanie':'federacja');
$('refresh').addEventListener('click',refreshLive);
window.addEventListener('lion-refresh',refreshLive);
render();
if(window.lionObserver){refreshLive();setInterval(refreshLive,30000);}
else $('freshness').textContent='Brak read-modelu; historyczny snapshot dostępny wyłącznie do przeglądania.';
</script></body></html>
