'use strict';
const data=JSON.parse(document.getElementById('observations').textContent);
const $=(t,cl,txt)=>{const x=document.createElement(t);if(cl)x.className=cl;if(txt!==undefined)x.textContent=String(txt);return x};
const block=(parent,child)=>{parent.appendChild(child);return child};
const cell=(row,tag,value)=>block(row,$(tag,'',value==null?'—':value));
const createTable=(columns,records)=>{
 const outer=$('div','tablewrap'),table=block(outer,$('table'));
 const header=block(block(table,$('thead')),$('tr'));
 for(const c of columns)cell(header,'th',c[0]);
 const body=block(table,$('tbody'));
 for(const obj of records){const tr=block(body,$('tr'));for(const c of columns)cell(tr,'td',c[1](obj))}
 return outer;
};
const section=(title,root)=>{const el=block(root,$('section'));block(el,$('h2','',title));return el};
const card=(title,value,desc,root)=>{
 const el=block(root,$('div','card'));
 block(el,$('div','caption',title));block(el,$('div','value',value));
 block(el,$('div','caption',desc));return el;
};
function renderCluster(target){
 const c=data.cluster;
 const stats=block(target,$('div','cards'));
 card('Docker MD',''+c.material_worker_count,(c.material_worker_states.exited||0)+' zaparkowanych',stats);
 card('Helpery MAT',''+c.logical_helpers.length,'osobna warstwa narzędzi',stats);
 card('Misje widoczne',''+c.missions_recent.length,'nie oznacza aktywnych wykonań',stats);
 card('Artefakty w ledgerze',''+c.historical_artifact_metadata.count,'0 dla Application Factory',stats);
 const note=block(target,$('div','notice','Dane nie dowodzą gotowości produkcyjnej. Workery MD są zaparkowane. Historyczne artefakty mają metadane, lecz pobieranie ich bajtów wymaga osobnego uwierzytelnionego API. SaaS auto-dispatch: PAUSED.'));
 const h=section('Kontrolery i źródła',target);
 for(const [name,v] of [
  ['Mission Control 8766',c.mission_control.status],
  ['Cognitive Bridge 8780',c.cognitive_bridge.status],
  ['SaaS handoff',c.saas_broker.state],
  ['SaaS pending',c.saas_broker.pending_count],
  ['Desktop',c.desktop.release],
 ])block(h,$('p','',name+': '+String(v??'UNKNOWN')));
 const w=section('Materialne kontenery — 32',target);
 block(w,createTable([['Worker',r=>r.name],['Docker state',r=>r.state],['ID',r=>r.id_prefix],['Status',r=>r.status]],c.workers));
 const m=section('MAT helpery — logika i narzędzia',target);
 block(m,createTable([['Helper',r=>r.name],['Stan z heartbeat',r=>r.state],['PID',r=>r.pid],['Odczyt',r=>r.observed_at]],c.logical_helpers));
 const artifacts=section('Artefakty — aktualnie indeks metadanych',target);
 const types=Object.entries(c.historical_artifact_metadata.type_counts).sort((a,b)=>b[1]-a[1]).map(([name,count])=>({name,count}));
 block(artifacts,createTable([['Typ artefaktu',r=>r.name],['Liczba historycznych',r=>r.count]],types));
 block(artifacts,$('p','muted','CONTENT BYTES: NOT_EXPOSED_BY_PREVIEW — brak ścieżki pobierania i powiązania z Application Factory.'));
 const mission=section('Misje z Mission Control',target);
 block(mission,createTable([['Mission ID',r=>r.mission_id],['Stan',r=>r.state],['Runtime',r=>r.runtime_state],['Materialized / Ready',r=>String(r.materialized)+' / '+String(r.ready)]],c.missions_recent));
 const logs=section('Log uruchamiania Desktop — tylko bezpieczny wycinek',target);
 for(const s of c.launch_log_tail)block(logs,$('div','log',s));
 block(logs,$('p','muted','Przegląd pełnych logów workera i artefaktów nie jest jeszcze podłączony do uwierzytelnionego read-modelu.'));
}
function renderSystem(target){
 const f=data.federation;
 const stats=block(target,$('div','cards'));
 card('Repozytoria federacji',f.repository_count,'źródło: GitHub default branch',stats);
 card('Kontrola zmian','SOURCE ONLY','brak możliwości merge w podglądzie',stats);
 const n=block(target,$('div','notice','To nie jest subskrypcja GitHub ani automatyczna synchronizacja. Pokazano SHA zaobserwowane podczas przygotowania snapshotu. Ich aktualność należy ponownie sprawdzić przed zależnym efektem.'));
 const s=section('Federation Source Vector — 10 repozytoriów',target);
 const inp=block(s,$('input'));inp.type='search';inp.placeholder='Filtruj repozytorium';
 const host=block(s,$('div'));host.style.marginTop='12px';
 function redraw(){
  host.replaceChildren();
  const chosen=f.repositories.filter(x=>x.name.toLowerCase().includes(inp.value.trim().toLowerCase()));
  const tab=createTable([['Repozytorium',r=>r.name],['Gałąź',r=>r.branch],['HEAD',r=>r.head_sha],['Klasa',r=>r.ref_source]],chosen);
  host.appendChild(tab);
  for(const record of chosen){
   const p=block(host,$('p','muted'));
   const a=block(p,$('a','',record.name+' · GitHub commit'));
   a.href='https://github.com/DonkeyJJLove/'+encodeURIComponent(record.name)+'/commit/'+record.head_sha;
   a.target='_blank';a.rel='noopener noreferrer';
  }
 }
 inp.addEventListener('input',redraw);redraw();
}
function choose(which){
 document.getElementById('clusterTab').classList.toggle('active',which==='cluster');
 document.getElementById('systemTab').classList.toggle('active',which==='system');
 const target=document.getElementById('content');target.replaceChildren();
 document.getElementById('provenance').textContent=
  'Snapshot '+data.generated_at+' · '+data.source_class+' · authority_effect=NONE · '+(which==='cluster'?'MOON / Windows / WSL':'GitHub / federation');
 if(which==='cluster')renderCluster(target);else renderSystem(target);
}
document.getElementById('clusterTab').addEventListener('click',()=>choose('cluster'));
document.getElementById('systemTab').addEventListener('click',()=>choose('system'));
choose(location.hash==='#system'?'system':'cluster');

const liveStamp=document.createElement('p');liveStamp.className='muted';
const liveStatus=document.createElement('div');
const liveButton=document.createElement('button');liveButton.type='button';liveButton.textContent='Odśwież teraz';
liveRefresh.append(liveTitle,liveStamp,liveButton,liveStatus);
document.getElementById('content').prepend(liveRefresh);
let lastObservation=null,refreshPending=false;
async function refreshLive(){
 if(refreshPending)return;
 refreshPending=true;liveButton.disabled=true;
 try{
  const value=await window.lionObserver.snapshot();
  if(value?.schema!=='lion.operator-read-model/v1'||value.authority_effect!=='NONE')throw Error('READ_MODEL_IDENTITY_INVALID');
  lastObservation=value;
  liveStamp.textContent='Odczyt '+value.observed_at+' • '+value.data_class+' • authority NONE';
  liveStatus.replaceChildren();
  const cards=document.createElement('div');cards.className='cards';
  for(const [key,val] of [
   ['Mission Control',value.endpoints.mission_control],
   ['LPCL / Model Chat',value.endpoints.panel],
   ['Local GPT',value.endpoints.model],
   ['SaaS broker',value.endpoints.broker_state],
   ['SaaS pending',value.endpoints.broker_pending],
   ['Misje widoczne',value.missions.length],
  ])card(key,String(val??'UNKNOWN'),'odczyt bieżący; nie oznacza dopuszczenia efektów',cards);
  liveStatus.appendChild(cards);
  const info=document.createElement('p');info.className='muted';
  const observedFleet=value.material_workers||{};
  const workerStamp=observedFleet.observation_time||observedFleet.snapshot_at||'UNKNOWN';
  info.textContent='Workery: '+String(observedFleet.source||'UNKNOWN')+
   ', aktualność '+String(observedFleet.currentness||'UNKNOWN')+
   ', obserwacja '+workerStamp+
   '. Repozytoria: snapshot '+String(value.repos.snapshot_at||'UNKNOWN')+
   '. Odczyt nie daje authority ani admission.';
  liveStatus.appendChild(info);
  if(value.scope==='cluster'){
   const fleetHead=document.createElement('h3');fleetHead.textContent='Flota MD — kanoniczny nośnik aktualności';
   liveStatus.appendChild(fleetHead);
   const fleetExplanation=document.createElement('p');fleetExplanation.className='muted';
   fleetExplanation.textContent='Źródło: '+String(observedFleet.source||'UNKNOWN')+
    ' • '+String(observedFleet.currentness||'UNKNOWN')+
    ' • digest: '+(observedFleet.carrier_digest_verified===true?'ZWERYFIKOWANY':'BRAK POTWIERDZENIA')+
    ' • stan: '+String(observedFleet.observed_runtime_state||'UNKNOWN')+
    ' • ready: '+String(observedFleet.ready??'—')+'/'+String(observedFleet.materialized??'—')+
    ' • provider/admission: NIEPOTWIERDZONE'+
    (observedFleet.reason?' • '+String(observedFleet.reason):'');
   liveStatus.appendChild(fleetExplanation);
   if(Array.isArray(observedFleet.workers)&&observedFleet.workers.length){
    liveStatus.appendChild(createTable([
     ['Worker',w=>w.worker_id||w.name],['Kontener',w=>w.container_state||w.state],
     ['Gotowość z nośnika',w=>w.ready===true?'TAK':'NIE'],
     ['Heartbeat',w=>w.heartbeat_observed_at||'—'],
     ['Id kontenera',w=>w.container_id_prefix||w.id_prefix||'—'],
    ],observedFleet.workers));
   }
   const title=document.createElement('h3');title.textContent='Aktualne misje (GET /api/v3/missions/recent)';
   liveStatus.appendChild(title);
   liveStatus.appendChild(createTable([['Misja',x=>x.mission_id],['Stan',x=>x.state],['Runtime',x=>x.runtime_state],['M / R',x=>x.materialized+' / '+x.ready]],value.missions));
   const logHead=document.createElement('h3');logHead.textContent='Logi Desktop — aktualny, ograniczony odczyt';liveStatus.appendChild(logHead);
   for(const line of value.logs.lines){const node=document.createElement('div');node.className='log';node.textContent=line;liveStatus.appendChild(node);}
  }else{
   const heading=document.createElement('h3');heading.textContent='Stan federacji: HEAD-y zapisane przy '+value.repos.snapshot_at;
   liveStatus.appendChild(heading);
   liveStatus.appendChild(createTable([['Repozytorium',x=>x.name],['Ref',x=>x.branch],['HEAD',x=>x.head_sha]],value.repos.repositories));
   const note=document.createElement('p');note.className='muted';
   note.textContent='Automatyczne odświeżanie dotyczy tylko kontrolerów live. Repozytoria wymagają ponownego GitHub-currentness przed zmianą.';
   liveStatus.appendChild(note);
  }
 }catch(e){
  liveStamp.textContent='Bieżący read-model niedostępny: '+String(e?.message||e).slice(0,120);
 }finally{refreshPending=false;liveButton.disabled=false}
}
liveButton.addEventListener('click',refreshLive);
window.addEventListener('lion-refresh',refreshLive);
if(window.lionObserver){refreshLive();setInterval(refreshLive,30000);}
else liveStamp.textContent='Live read-model niepołączony — poniżej widoczny wyłącznie historyczny snapshot.';

</script>
</body></html>
