    image: lion-r20-worker:r1
    container_name: lion-r20-w01
    user: "65532:65532"
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    restart: "no"
    labels:
      TASK_ID: LION-R20-SOL-L64-W8-PANEL-SAAS-REPAIR-R1
    volumes:
      - ./source:/src:ro
      - ./evidence:/evidence:ro
      - ./worker/W01.json:/mission/spec.json:ro
