      "observation_or_effect": "observation",
      "authority_required": "odczyt wskazanego repo",
      "mission_scope_required": true,
      "target_scope": "konkretny cel z bieżącego zlecenia",
      "currentness_precondition": "exact ref",
      "readback_required": true,
      "reconciliation_required": true,
      "forbidden_escalation": "NONE"
    },
    {
      "tool_or_capability": "repository_candidate_write",
