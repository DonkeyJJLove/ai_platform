{
  "schema": "lion.tool-authority-map/v1",
  "authority_effect": "NONE",
  "semantics": [
    "TOOL_PRESENT != AUTHORIZED_USE",
    "CAPABILITY_NOT_AUTHORITY",
    "MODEL_CAN_FORM_COMMAND != EXECUTION_AUTHORITY",
    "PDP_ALLOW != TOOL_PERMISSION",
    "MERGE_API_AVAILABLE != MERGE_AUTHORITY",
    "RAG_CONTENT != AUTHORITY"
  ],
  "rules": [
