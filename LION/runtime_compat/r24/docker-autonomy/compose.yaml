x-worker-env: &worker-env
  LION_MISSION_CONTROL_URL: http://host.docker.internal:8766
  LION_LOCAL_MODEL_URL: http://host.docker.internal:8772
  LION_WORKER_IDENTITY_FILE: /identity/current.json
  LION_COOPERATIVE_BOOTSTRAP_MODE: UNBOUND
  LION_COOPERATIVE_BOOTSTRAP_VERSION: "1.0.0"
  LION_COOPERATIVE_REPOSITORY_ROOT: /src
  LION_COOPERATIVE_PRIVATE_ROOT: /cooperative
  LION_COOPERATIVE_DEPENDENCY_MODULE_PATH: /cooperative-provider-artifact/cooperative-provider.py
  LION_COOPERATIVE_DEPENDENCY_MODULE_SHA256: 74df09c450498235e8bf30f9e5ede748dc4c7f54237357dd0b757324c7780a5d
  LION_COOPERATIVE_DEPENDENCY_FACTORY: build_dependencies
  LION_COOPERATIVE_PROVIDER_FACTORY_VERSION: "1.0.0"
  LION_COOPERATIVE_MISSION_DB_PATH: /mission-control/mission-control-v3.db
  LION_COOPERATIVE_PROVIDER_DB_PATH: /cooperative-provider/evidence.sqlite
  LION_COOPERATIVE_CONTEXT_CARRIER_ROOT: /cooperative-provider/contexts
  LION_COOPERATIVE_PROVIDER_CONFIG_PATH: /cooperative-provider/provider-config.json
  LION_COOPERATIVE_CONTROL_PLANE_DB_PATH: /cooperative-control/control-plane.sqlite
  LION_COOPERATIVE_AUTHORITY_STATE_DB_PATH: /cooperative-control/authority-state.sqlite
  LION_COOPERATIVE_VERIFIER_MODULE_PATH: /cooperative-control/verifier.py
  LION_COOPERATIVE_VERIFIER_MODULE_SHA256: ${LION_COOPERATIVE_VERIFIER_MODULE_SHA256:-}
  LION_COOPERATIVE_VERIFIER_CALLABLE: ${LION_COOPERATIVE_VERIFIER_CALLABLE:-verify}
  LION_COOPERATIVE_VERIFIER_READY_CALLABLE: ${LION_COOPERATIVE_VERIFIER_READY_CALLABLE:-ready}
  LION_COOPERATIVE_LOCAL_AUTHORITY_STATE_PATH: /cooperative/state/authority-local.sqlite
  PYTHONPATH: /src

x-worker-labels: &worker-labels
  LION_ROLE: MATERIAL_EXECUTOR
  LION_WORKER_PROFILE: LION_MATERIAL_EXECUTOR_V2
  LION_MODEL: gpt-oss-20b-MXFP4
  LION_AUTHORITY_EFFECT: NONE
  LION_AUTHORITY_CEILING: NONE
  LION_MATERIAL_EXECUTOR_INDEPENDENCE: NOT_PROVEN_SHARED_MOON_DOMAIN

x-worker-common: &worker-common
  image: lion-r20-worker:r1
  entrypoint: ["python3", "/runtime/worker.py"]
  restart: unless-stopped
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  pids_limit: 128
  mem_limit: 512m
  cpus: 0.50
  extra_hosts:
    - "host.docker.internal:host-gateway"
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=32m
  volumes:
    - ./source:/src:ro
    - ./worker.py:/runtime/worker.py:ro
    - ./identity.json:/identity/current.json:ro
    - ./status:/status:rw
    - ./gate:/gate:rw
    - ./provider-artifact:/cooperative-provider-artifact:ro
    - ${LION_COOPERATIVE_PROVIDER_STATE_HOST_PATH:-./unbound/provider-state}:/cooperative-provider:ro
    - ${LION_COOPERATIVE_CONTROL_STATE_HOST_PATH:-./unbound/control-state}:/cooperative-control:ro
    - ${LION_COOPERATIVE_MISSION_CONTROL_HOST_PATH:-./unbound/mission-control}:/mission-control:ro

