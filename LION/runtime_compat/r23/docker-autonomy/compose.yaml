name: lion-r23-autonomy
services:
  worker-01:
    image: lion-r20-worker:r1
    container_name: lion-r23-md001
    entrypoint: ["python3","/runtime/worker.py"]
    restart: unless-stopped
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 512m
    cpus: 0.50
    environment:
      LION_MATERIAL_WORKER_ID: MD001
      LION_MISSION_CONTROL_URL: http://host.docker.internal:8766
      LION_LOCAL_MODEL_URL: http://host.docker.internal:8772
      PYTHONPATH: /src
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - /srv/lion-e4-candidate-r1/r20-mission/source:/src:ro
      - ./worker.py:/runtime/worker.py:ro
      - ./status:/status:rw
      - ./gate:/gate:rw
    labels:
      LION_ROLE: MATERIAL_LOCAL_MODEL_WORKER
      LION_MATERIAL_WORKER_ID: MD001
      LION_MODEL: gpt-oss-20b-MXFP4
      LION_AUTHORITY_EFFECT: NONE
