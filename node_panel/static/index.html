<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LION CONTROL R18</title>
<style>body{font-family:system-ui;margin:0;background:#111;color:#eee}header,main{max-width:1100px;margin:auto;padding:16px}button,select,textarea,input{font:inherit}#threads{display:flex;gap:8px;flex-wrap:wrap}.thread{padding:8px;background:#222;border:1px solid #444}.msg{padding:8px;margin:6px 0;background:#1b1b1b}.assistant{border-left:3px solid #aaa}textarea{width:100%;min-height:100px;background:#181818;color:#eee}pre{white-space:pre-wrap}</style></head>
<body><header><h1>LION CONTROL · Node/Express R18</h1><pre id="state">loading…</pre></header><main><div id="threads"></div><h2 id="title">Wątek</h2><div id="messages"></div><textarea id="input" placeholder="Wiadomość"></textarea><p><select id="route"><option>LOCAL</option><option>CHATGPT</option><option>AUTO</option></select> <button id="send">Wyślij</button> <button id="newThread">Nowy wątek</button></p></main>
<script>
let active=null;const $=s=>document.querySelector(s);
async function api(u,o){const r=await fetch(u,{headers:{'content-type':'application/json'},...o});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j}
async function refreshState(){const s=await api('/api/state');$('#state').textContent=JSON.stringify(s,null,2)}
async function threads(){const x=await api('/api/threads');$('#threads').innerHTML='';for(const t of x.threads){const b=document.createElement('button');b.className='thread';b.textContent=t.title;b.onclick=()=>open(t.thread_id);$('#threads').appendChild(b)}if(!active&&x.threads[0])open(x.threads[0].thread_id)}
async function open(id){active=id;const t=await api('/api/threads/'+id);$('#title').textContent=t.title;$('#messages').innerHTML='';for(const m of t.messages){const d=document.createElement('div');d.className='msg '+m.role;d.textContent=m.role+': '+m.content;$('#messages').appendChild(d)}}
$('#newThread').onclick=async()=>{const t=await api('/api/threads',{method:'POST',body:JSON.stringify({title:'Nowa rozmowa'})});active=t.thread_id;await threads();await open(active)}
$('#send').onclick=async()=>{if(!active){await $('#newThread').onclick()}const message=$('#input').value.trim();if(!message)return;const r=await api('/api/threads/'+active+'/chat',{method:'POST',body:JSON.stringify({message,route:$('#route').value})});$('#input').value='';await open(active);if(r.state!=='RECONCILED')setTimeout(()=>open(active),2000)}
refreshState().catch(e=>$('#state').textContent=e.message);threads().catch(console.error);setInterval(()=>refreshState().catch(()=>{}),5000);
</script></body></html>
