name: MOON Bounded File Write

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: read

concurrency:
  group: moon-bounded-file-write
  cancel-in-progress: false

jobs:
  write:
    if: >-
      github.event.issue.number == 144 &&
      startsWith(github.event.comment.body, 'MOON-FILE-WRITE v2')
    runs-on: [self-hosted, linux, lion-trust-client]
    timeout-minutes: 5
    steps:
      - name: Verify MOON execution context
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "lion-moon-r9d8-test"
          test -d /home/d2j3
          test ! -L /home/d2j3
          command -v python3 >/dev/null

      - name: Fetch exact canonical mediation implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          if len(sha) != 40 or any(c not in "0123456789abcdef" for c in sha.lower()):
              raise SystemExit("invalid GITHUB_SHA")

          root = Path(os.environ["RUNNER_TEMP"]) / "moon-mediated-runtime"
          paths = (
              "cyber_lion/contracts/moon_file_write.py",
              "cyber_lion/enterprise/moon_file_write_mediation.py",
              "cyber_lion/enterprise/moon_file_write.py",
          )
          for package in (root / "cyber_lion", root / "cyber_lion/contracts", root / "cyber_lion/enterprise"):
              package.mkdir(parents=True, exist_ok=True)
              (package / "__init__.py").write_text("", encoding="utf-8")

          for rel in paths:
              url = f"https://raw.githubusercontent.com/{repository}/{sha}/{rel}"
              request = urllib.request.Request(url, headers={"User-Agent": "lion-moon-file-write-bootstrap/2"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = response.read(131073)
              if not data or len(data) > 131072:
                  raise SystemExit(f"bounded implementation fetch size invalid: {rel}")
              target = root / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Execute canonical mediated file write
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/moon-mediated-runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m cyber_lion.enterprise.moon_file_write \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --runner-name "$RUNNER_NAME" | tee "$RUNNER_TEMP/moon-file-write.receipt"

      - name: Publish receipt summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/moon-file-write.receipt" ]; then
            {
              echo '```text'
              cat "$RUNNER_TEMP/moon-file-write.receipt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
