name: LION Operator Intervention CI Fix

on:
  push:
    branches: ["mission/operator-intervention-r1"]
    paths: [".github/workflows/operator-intervention-ci-fix.yml"]

permissions:
  contents: write

jobs:
  apply-tested-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify exact patch applies
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/operator-intervention/ci-fix.patch
          git apply .github/operator-intervention/ci-fix.patch
          git diff --check
      - name: Bind exact restart-package hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('tools/lion_effect_admission_broker.py')
          text=path.read_text(encoding='utf-8')
          old='7ed9c6da9f5aa73f1079aae3581c8fdc6666be00982ec2d5f817eba0382ec337'
          new='e6d609f709f8ca5c5adbe0f4699fb704867d55066794219d5ebd75f5b893af86'
          if text.count(old)!=1:
              raise SystemExit('OPERATOR_CONTROL_MANIFEST_BINDING_DRIFT')
          path.write_text(text.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify runtime layering boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('tools/lion_local_intelligence_runtime.py')
          tree=ast.parse(path.read_text(encoding='utf-8'),filename=str(path))
          bad=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  names=[alias.name for alias in node.names]
              elif isinstance(node,ast.ImportFrom):
                  names=[node.module or '']
              else:
                  continue
              bad.extend(name for name in names if name.startswith('cyber_lion.mission_control'))
          if bad:
              raise SystemExit('LOCAL_RUNTIME_AUTHORITY_IMPORT='+','.join(sorted(set(bad))))
          print('LOCAL_RUNTIME_AUTHORITY_IMPORT=NONE')
          PY
      - name: Compile changed control surfaces
        run: python -m compileall -q cyber_lion tools/lion_local_intelligence_runtime.py tools/lion_effect_admission_broker.py
      - name: Run operator intervention regression gate
        run: >-
          python -m unittest
          cyber_lion.tests.test_operator_full_sat
          cyber_lion.tests.test_operator_provision
          cyber_lion.tests.test_operator_effect_boundary
          cyber_lion.tests.test_operator_control
          cyber_lion.tests.test_operator_client
          cyber_lion.tests.test_operator_privileged_deploy
          cyber_lion.tests.test_operator_panel_security
          cyber_lion.tests.test_operator_gateway
          cyber_lion.tests.test_operator_containment_helper
          cyber_lion.tests.test_operator_backpressure
          cyber_lion.tests.test_operator_worker_delivery
          cyber_lion.tests.test_operator_capability_registry
          cyber_lion.tests.test_scheduler_storage_reconciliation
          cyber_lion.tests.test_local_assignment_worker
          cyber_lion.tests.test_mission_control_v3_restart_package
      - name: Commit only tested result and remove bootstrap artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/operator-intervention/ci-fix.patch
          rm -f .github/workflows/operator-intervention-ci-fix.yml
          rmdir .github/operator-intervention 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'LION operator intervention: close CI security and layering gates'
          git push origin HEAD:mission/operator-intervention-r1
