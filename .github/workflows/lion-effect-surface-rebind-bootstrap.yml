name: LION Effect Surface Rebind Closure Diagnostic

on:
  push:
    branches:
      - repair/effect-surface-rebind-bootstrap-r1

permissions:
  contents: read

jobs:
  diagnose-exact-rebind-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@v6
        with:
          ref: repair/effect-surface-census-rebind-r1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact repair parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "7623a06e9ac0ad39b66c83410947f5f05e4334ff"
          test "$(git rev-parse HEAD^{tree})" = "b71bfe10fb9acc20a29071ff1c8b286461f239fd"
          test -z "$(git status --porcelain)"

      - name: Materialize exact current-state rebind and truth closure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old_scan = "21c2c23613f6c980e771d5751695464ae13365718ec3bf6a47de123eb974b2c9"
          new_scan = "c8a9808505610881c48f827e9e7158287588f15c0ba8e4020f5cf0777d7f0ed0"
          scan_paths = [
              "cyber_lion/tests/test_p0_moon_permission_policy_reclassification.py",
              "cyber_lion/tests/test_p0_moon_readonly_observer_falsification_runtime.py",
              "cyber_lion/tests/test_p0_moon_runner_attested_execution_bridge.py",
              "cyber_lion/tests/test_p0_moon_same_connection_denial_carrier.py",
              "cyber_lion/tests/test_p0_moon_seven_binding_chain.py",
              "tools/p0_moon_attested_adjudication.py",
              "tools/p0_moon_readonly_observer_falsification.py",
              "tools/p0_moon_same_connection_denial_carrier.py",
              "tools/p0_moon_seven_binding.py",
              "tools/p0_surface_closure_campaign.py",
          ]

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement cardinality {path}: {count} for {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          for path in scan_paths:
              replace_once(path, old_scan, new_scan)

          replacements = {
              "cyber_lion/tests/test_host_authority_separation.py": [
                  ("(343,338,6)", "(345,412,6)"),
              ],
              "cyber_lion/tests/test_p0_moon_permission_policy_reclassification.py": [
                  ("len(self.inv.surfaces),338", "len(self.inv.surfaces),412"),
                  ('{"MEDIATED":7,"PARTIAL":0,"UNMEDIATED":0,"UNKNOWN":331}', '{"MEDIATED":7,"PARTIAL":0,"UNMEDIATED":0,"UNKNOWN":405}'),
              ],
              "cyber_lion/tests/test_p0_moon_seven_closure_readiness.py": [
                  ('{"MEDIATED":6,"PARTIAL":1,"UNMEDIATED":0,"UNKNOWN":331}', '{"MEDIATED":6,"PARTIAL":1,"UNMEDIATED":0,"UNKNOWN":405}'),
              ],
              "cyber_lion/tests/test_p0_surface_closure_campaign.py": [
                  ('"persistent_state.write":279', '"persistent_state.write":353'),
                  ("len(inv.surfaces),338", "len(inv.surfaces),412"),
                  ("c.remaining_surface_count,337", "c.remaining_surface_count,411"),
                  ('=="UNKNOWN" for x in c.work_items),330', '=="UNKNOWN" for x in c.work_items),404'),
                  ("self.assertEqual(len(multi),44);self.assertEqual(sum(len(f.surface_digests) for f in multi),323);self.assertEqual(len(single),14)", "self.assertEqual(len(multi),45);self.assertEqual(sum(len(f.surface_digests) for f in multi),397);self.assertEqual(len(single),14)"),
                  ("sum(len(f.surface_digests) for f in c.provider_families),337", "sum(len(f.surface_digests) for f in c.provider_families),411"),
              ],
              "tools/p0_moon_attack_policy_v2_contract.py": [
                  ("self.unknown_outside_seven_count!=331", "self.unknown_outside_seven_count!=405"),
              ],
              "tools/p0_moon_permission_policy_reclassification.py": [
                  ('{"MEDIATED":7,"PARTIAL":0,"UNMEDIATED":0,"UNKNOWN":331}', '{"MEDIATED":7,"PARTIAL":0,"UNMEDIATED":0,"UNKNOWN":405}'),
              ],
              "tools/p0_moon_seven_closure_readiness.py": [
                  ("self.unknown_outside_seven_count!=331", "self.unknown_outside_seven_count!=405"),
                  ('{"MEDIATED":6,"PARTIAL":1,"UNMEDIATED":0,"UNKNOWN":331}', '{"MEDIATED":6,"PARTIAL":1,"UNMEDIATED":0,"UNKNOWN":405}'),
              ],
          }
          for path, pairs in replacements.items():
              for old, new in pairs:
                  replace_once(path, old, new)

          effect_paths = {
              "cyber_lion/tests/test_host_authority_separation.py",
              "cyber_lion/tests/test_p0_moon_permission_policy_reclassification.py",
              "cyber_lion/tests/test_p0_moon_readonly_observer_falsification_runtime.py",
              "cyber_lion/tests/test_p0_moon_runner_attested_execution_bridge.py",
              "cyber_lion/tests/test_p0_moon_same_connection_denial_carrier.py",
              "cyber_lion/tests/test_p0_moon_seven_binding_chain.py",
              "cyber_lion/tests/test_p0_moon_seven_closure_readiness.py",
              "cyber_lion/tests/test_p0_surface_closure_campaign.py",
              "tools/p0_moon_attack_policy_v2_contract.py",
              "tools/p0_moon_attested_adjudication.py",
              "tools/p0_moon_permission_policy_reclassification.py",
              "tools/p0_moon_readonly_observer_falsification.py",
              "tools/p0_moon_same_connection_denial_carrier.py",
              "tools/p0_moon_seven_binding.py",
              "tools/p0_moon_seven_closure_readiness.py",
              "tools/p0_surface_closure_campaign.py",
          }
          changed = set(subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines())
          if changed != effect_paths:
              raise SystemExit(f"effect changed-file set mismatch: expected={sorted(effect_paths)} actual={sorted(changed)}")
          PY

          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "5d50ff152cb5c148df75fd24d3c8abc0b7910e26"

          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          old_digest = "e600fd15112eb27b4c47e83eca2ee2ae0eca4c2ca1efc884376b9a7b22d3fdbd"
          new_digest = "39a01e70efc2cc87e2db0ccd0d296a8cc7ac70d3db363eb7967d444d53e47dc4"
          carriers = {
              "LION/architecture/canonical-state-v1-3-candidate.json",
              "cyber_lion/registry/repositories.json",
          }
          for path in sorted(carriers):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old_digest)
              if count != 1:
                  raise SystemExit(f"carrier replacement cardinality {path}: {count}")
              p.write_text(text.replace(old_digest, new_digest, 1), encoding="utf-8")

          effect_paths = {
              "cyber_lion/tests/test_host_authority_separation.py",
              "cyber_lion/tests/test_p0_moon_permission_policy_reclassification.py",
              "cyber_lion/tests/test_p0_moon_readonly_observer_falsification_runtime.py",
              "cyber_lion/tests/test_p0_moon_runner_attested_execution_bridge.py",
              "cyber_lion/tests/test_p0_moon_same_connection_denial_carrier.py",
              "cyber_lion/tests/test_p0_moon_seven_binding_chain.py",
              "cyber_lion/tests/test_p0_moon_seven_closure_readiness.py",
              "cyber_lion/tests/test_p0_surface_closure_campaign.py",
              "tools/p0_moon_attack_policy_v2_contract.py",
              "tools/p0_moon_attested_adjudication.py",
              "tools/p0_moon_permission_policy_reclassification.py",
              "tools/p0_moon_readonly_observer_falsification.py",
              "tools/p0_moon_same_connection_denial_carrier.py",
              "tools/p0_moon_seven_binding.py",
              "tools/p0_moon_seven_closure_readiness.py",
              "tools/p0_surface_closure_campaign.py",
          }
          expected = effect_paths | carriers
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "HEAD"], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f"closure changed-file set mismatch: expected={sorted(expected)} actual={sorted(changed)}")
          PY

          git add -A
          git diff --cached --check
          echo "FINAL_WRITE_TREE=$(git write-tree)"
          git config user.name "LION Diagnostic Bot"
          git config user.email "lion-diagnostic@users.noreply.github.com"
          git commit -m "LION: close effect-surface rebind truth currentness"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          test -z "$(git status --porcelain)"

      - name: Diagnose Cyber-Lion full suite
        shell: bash
        run: |
          set -uo pipefail
          set +e
          echo "HEAD=$(git rev-parse HEAD)"
          echo "TREE=$(git rev-parse HEAD^{tree})"
          echo "STATUS=$(test -z "$(git status --porcelain)" && echo CLEAN || echo DIRTY)"
          python -VV
          python - <<'PY'
          import os, platform, sqlite3, sys
          print("SYS_EXECUTABLE=" + sys.executable)
          print("SYS_VERSION=" + sys.version.replace("\n", " "))
          print("PLATFORM=" + platform.platform())
          print("SQLITE_VERSION=" + sqlite3.sqlite_version)
          for key in ("RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion", "CI", "GITHUB_ACTIONS"):
              print(f"ENV_{key}={os.environ.get(key, '')}")
          PY
          git --version
          LOG="$RUNNER_TEMP/lion-full-suite.log"
          python -m unittest discover -s cyber_lion/tests -p 'test_*.py' -v >"$LOG" 2>&1
          RC=$?
          echo "UNITTEST_RC=$RC"
          python - "$LOG" <<'PY'
          import re, sys
          from pathlib import Path
          text = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          lines = text.splitlines()
          print("--- SUMMARY ---")
          for line in lines:
              if re.match(r"^(Ran \d+ tests|FAILED \(|OK(?: \(|$)|FAIL: |ERROR: )", line):
                  print(line)
          print("--- FAILURE_BLOCKS ---")
          sep = "=" * 70
          blocks = 0
          for part in text.split(sep):
              stripped = part.strip()
              if stripped.startswith("FAIL: ") or stripped.startswith("ERROR: "):
                  blocks += 1
                  print(sep)
                  print(stripped[-12000:])
          if blocks == 0 and "FAILED (" in text:
              print(text[-20000:])
          print("--- END ---")
          PY
          exit "$RC"
