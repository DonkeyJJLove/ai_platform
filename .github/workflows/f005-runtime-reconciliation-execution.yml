name: F005 Runtime Reconciliation Execution

on:
  workflow_dispatch:
    inputs:
      expected_master:
        description: Exact live master SHA
        required: true
        type: string
      expected_master_tree:
        description: Exact live master tree SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-reconciliation-execution:
    name: F005 Runtime Reconciliation Execution
    runs-on: [self-hosted, lion-runtime]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      LION_FLEET_RUNTIME_ROOT: 'C:\Users\d2j3\Documents\LION\runtime\f005'

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.expected_master }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Bind checkout to exact master and tree
        env:
          EXPECTED_MASTER: ${{ inputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ inputs.expected_master_tree }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_MASTER) {
            throw "master binding mismatch: $actualSha != $env:EXPECTED_MASTER"
          }
          $actualTree = (git show -s --format=%T HEAD).Trim()
          if ($actualTree -ne $env:EXPECTED_MASTER_TREE) {
            throw "master tree binding mismatch: $actualTree != $env:EXPECTED_MASTER_TREE"
          }

      - name: Compile F005-Q slice
        run: |
          python -m compileall -q `
            cyber_lion/contracts/fleet_runtime_reconciliation_execution.py `
            cyber_lion/enterprise/fleet_runtime_reconciliation_execution.py `
            cyber_lion/enterprise/fleet_runtime_reconciliation_preflight.py

      - name: Run F005-Q regressions
        run: |
          python -m unittest `
            cyber_lion.tests.test_fleet_runtime_reconciliation_execution `
            cyber_lion.tests.test_fleet_runtime_reconciliation_preflight `
            cyber_lion.tests.test_fleet_recorded_inventory_reconciliation `
            cyber_lion.tests.test_fleet_closure_preconditions_provider `
            -v

      - name: Verify runtime prerequisites
        run: |
          $root = $env:LION_FLEET_RUNTIME_ROOT
          foreach ($relative in @(
            'status.sqlite',
            'coordination.sqlite',
            'reconciliation.sqlite',
            'trust\reconciliation-trust.json',
            'reconciliation-source\repository-inventory.json'
          )) {
            $path = Join-Path $root $relative
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "required runtime source missing: $path"
            }
          }
          $legacy = Join-Path $root 'reconciliation-execution-receipt.json'
          if (Test-Path -LiteralPath $legacy -PathType Leaf) {
            Write-Host 'legacy execution receipt present; executor will validate and classify its inventory epoch'
          }

      - name: Execute one recorded-inventory reconciliation
        id: execute
        env:
          EXPECTED_MASTER: ${{ inputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ inputs.expected_master_tree }}
        run: |
          $receipt = python -m cyber_lion.enterprise.fleet_runtime_reconciliation_execution `
            --repository DonkeyJJLove/ai_platform `
            --expected-master $env:EXPECTED_MASTER `
            --expected-master-tree $env:EXPECTED_MASTER_TREE `
            --repository-root $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) {
            throw 'F005-Q runtime reconciliation execution failed'
          }
          if ([string]::IsNullOrWhiteSpace($receipt)) {
            throw 'F005-Q runtime reconciliation execution emitted no receipt'
          }
          "receipt=$receipt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish non-authoritative execution receipt summary
        env:
          RECEIPT_JSON: ${{ steps.execute.outputs.receipt }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RECEIPT_JSON)) {
            throw 'execution receipt output missing after successful execution'
          }
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### F005-Q Runtime Reconciliation Execution'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $env:RECEIPT_JSON
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
