name: LION Actions Dispatch Bridge

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: lion-actions-dispatch-bridge
  cancel-in-progress: false

jobs:
  dispatch-or-observe:
    if: >-
      github.event.issue.number == 144 &&
      (
        startsWith(github.event.comment.body, 'LION-DISPATCH v1') ||
        startsWith(github.event.comment.body, 'LION-OBSERVE v1')
      )
    runs-on: [self-hosted, linux, lion-trust-client]
    timeout-minutes: 10
    env:
      LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_PATH: /opt/lion/trusted-runtime/workflow-dispatch-test/runtime_provider.py
      LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_DIGEST: ef2dc1c79ed368dded5a2725bedb6e97e3c0b76f1d736f037f43fc739ea6a080
      LION_WORKFLOW_DISPATCH_FENCE_DATABASE_PATH: /var/lib/lion/fence/workflow-dispatch.sqlite
    steps:
      - name: Checkout exact control-plane implementation
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify trusted MOON execution context
        shell: bash
        run: |
          set -euo pipefail
          test "$RUNNER_NAME" = "lion-moon-r9d8-test"
          test -r "$LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_PATH"
          test "$(sha256sum "$LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_PATH" | awk '{print $1}')" = "$LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_DIGEST"
          case "$LION_WORKFLOW_DISPATCH_RUNTIME_MODULE_PATH" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) exit 1 ;;
          esac
          case "$LION_WORKFLOW_DISPATCH_FENCE_DATABASE_PATH" in
            "$GITHUB_WORKSPACE"|"$GITHUB_WORKSPACE"/*) exit 1 ;;
          esac
          test -d "$(dirname "$LION_WORKFLOW_DISPATCH_FENCE_DATABASE_PATH")"
          test -w "$(dirname "$LION_WORKFLOW_DISPATCH_FENCE_DATABASE_PATH")"

      - name: Compile dispatch, observation and failure-receipt boundaries
        run: |
          python -m compileall -q \
            cyber_lion/contracts/actions_dispatch_bridge.py \
            cyber_lion/enterprise/actions_dispatch_bridge.py \
            cyber_lion/enterprise/actions_dispatch_temporal_compat.py \
            cyber_lion/enterprise/actions_failure_receipt.py

      - name: Execute bounded dispatch or observation bridge
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          stdout_file="$RUNNER_TEMP/lion-actions-control.stdout"
          stderr_file="$RUNNER_TEMP/lion-actions-control.stderr"

          set +e
          python -m cyber_lion.enterprise.actions_dispatch_temporal_compat \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            >"$stdout_file" 2>"$stderr_file"
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            cat "$stdout_file"
            exit 0
          fi

          python -m cyber_lion.enterprise.actions_failure_receipt \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --exit-code "$rc" \
            --stdout "$stdout_file" \
            --stderr "$stderr_file"

          exit "$rc"
