name: Cyber-Lion Core
on:
  workflow_dispatch:
  pull_request:
    paths: ["cyber_lion/**", ".github/workflows/cyber-lion-contracts.yml", "README.md", "LION/evolution/SPECTRA_R2E4_EVIDENCE_BINDING.json"]
  push:
    branches: ["master", "cyber-lion/**", "mission/r2e4-fleet-manifest-exact-head-semantic-binding"]
    paths: ["cyber_lion/**", ".github/workflows/cyber-lion-contracts.yml", "README.md", "LION/evolution/SPECTRA_R2E4_EVIDENCE_BINDING.json"]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Emit literal checkout identity evidence
        shell: bash
        run: |
          set -euo pipefail

          require_sha40() {
            local value="$1"
            local label="$2"
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              printf '%s_INVALID=%s\n' "$label" "$value" >&2
              exit 1
            fi
          }

          resolve_live_sha() {
            local branch="$1"
            local label="$2"
            local exact_ref="refs/heads/$branch"
            local output
            if ! output="$(git ls-remote --exit-code origin "$exact_ref")"; then
              printf '%s_UNAVAILABLE=%s\n' "$label" "$exact_ref" >&2
              exit 1
            fi
            if [ -z "$output" ] || [[ "$output" == *$'\n'* ]]; then
              printf '%s_CARDINALITY_INVALID=%s\n' "$label" "$exact_ref" >&2
              exit 1
            fi
            local sha resolved_ref extra
            read -r sha resolved_ref extra <<< "$output"
            if [ -n "${extra:-}" ] || [ "$resolved_ref" != "$exact_ref" ]; then
              printf '%s_RESOLUTION_INVALID=%s\n' "$label" "$output" >&2
              exit 1
            fi
            require_sha40 "$sha" "$label"
            printf '%s\n' "$sha"
          }

          require_sha40 "$GITHUB_SHA" "GITHUB_SHA"
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          require_sha40 "$ACTUAL_HEAD" "CHECKED_OUT_HEAD"
          if [ "$ACTUAL_HEAD" != "$GITHUB_SHA" ]; then
            printf 'CHECKED_OUT_HEAD_MISMATCH actual=%s expected=%s\n' "$ACTUAL_HEAD" "$GITHUB_SHA" >&2
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
            printf 'CHECKED_OUT_HEAD=%s\n' "$ACTUAL_HEAD"
          else
            mapfile -t EVENT_VALUES < <(python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          def sha40(value, label):
              if type(value) is not str:
                  raise SystemExit(f"{label} invalid")
              if value != value.lower() or len(value) != 40 or any(ch not in "0123456789abcdef" for ch in value):
                  raise SystemExit(f"{label} invalid")
              return value

          def branch(value, label):
              if (
                  type(value) is not str
                  or not value
                  or value != value.strip()
                  or len(value) > 255
                  or value.startswith(("-", "refs/"))
              ):
                  raise SystemExit(f"{label} invalid")
              return value

          event_path = os.environ.get("GITHUB_EVENT_PATH")
          if type(event_path) is not str or not event_path:
              raise SystemExit("GitHub event path unavailable")
          try:
              event = json.loads(Path(event_path).read_text(encoding="utf-8"))
          except (OSError, ValueError) as exc:
              raise SystemExit("GitHub event payload invalid") from exc
          pr = event.get("pull_request")
          if type(pr) is not dict:
              raise SystemExit("pull_request payload unavailable")
          head = pr.get("head")
          base = pr.get("base")
          if type(head) is not dict or type(base) is not dict:
              raise SystemExit("pull_request endpoint identity invalid")
          print(sha40(head.get("sha"), "event head sha"))
          print(sha40(base.get("sha"), "event base sha"))
          print(branch(head.get("ref"), "event head ref"))
          print(branch(base.get("ref"), "event base ref"))
          PY
            )
            if [ "${#EVENT_VALUES[@]}" -ne 4 ]; then
              printf 'PR_EVENT_IDENTITY_CARDINALITY_INVALID=%s\n' "${#EVENT_VALUES[@]}" >&2
              exit 1
            fi

            EVENT_HEAD_SHA="${EVENT_VALUES[0]}"
            EVENT_BASE_SHA="${EVENT_VALUES[1]}"
            EVENT_HEAD_REF="${EVENT_VALUES[2]}"
            EVENT_BASE_REF="${EVENT_VALUES[3]}"
            require_sha40 "$EVENT_HEAD_SHA" "EVENT_HEAD_SHA"
            require_sha40 "$EVENT_BASE_SHA" "EVENT_BASE_SHA"
            if ! git check-ref-format --branch "$EVENT_HEAD_REF" >/dev/null 2>&1; then
              printf 'EVENT_HEAD_REF_INVALID=%s\n' "$EVENT_HEAD_REF" >&2
              exit 1
            fi
            if ! git check-ref-format --branch "$EVENT_BASE_REF" >/dev/null 2>&1; then
              printf 'EVENT_BASE_REF_INVALID=%s\n' "$EVENT_BASE_REF" >&2
              exit 1
            fi

            LIVE_BASE_SHA="$(resolve_live_sha "$EVENT_BASE_REF" "LIVE_BASE_SHA")"
            LIVE_HEAD_SHA="$(resolve_live_sha "$EVENT_HEAD_REF" "LIVE_HEAD_SHA")"
            if [ "$EVENT_BASE_SHA" != "$LIVE_BASE_SHA" ]; then
              printf 'PR_BASE_DRIFT event=%s live=%s\n' "$EVENT_BASE_SHA" "$LIVE_BASE_SHA" >&2
              exit 1
            fi
            if [ "$EVENT_HEAD_SHA" != "$LIVE_HEAD_SHA" ]; then
              printf 'PR_HEAD_DRIFT event=%s live=%s\n' "$EVENT_HEAD_SHA" "$LIVE_HEAD_SHA" >&2
              exit 1
            fi

            VERIFICATION_REF="refs/lion/r2e4-evidence-head"
            git fetch --no-tags --depth=1 origin "refs/heads/${EVENT_HEAD_REF}:${VERIFICATION_REF}" >/dev/null 2>&1
            CANDIDATE_HEAD="$(git rev-parse "${VERIFICATION_REF}^{commit}")"
            require_sha40 "$CANDIDATE_HEAD" "CANDIDATE_HEAD"
            if [ "$CANDIDATE_HEAD" != "$EVENT_HEAD_SHA" ]; then
              printf 'PR_CANDIDATE_HEAD_MISMATCH event=%s fetched=%s\n' "$EVENT_HEAD_SHA" "$CANDIDATE_HEAD" >&2
              exit 1
            fi
            PR_CANDIDATE_TREE="$(git rev-parse "${VERIFICATION_REF}^{tree}")"
            require_sha40 "$PR_CANDIDATE_TREE" "PR_CANDIDATE_TREE"

            PR_EXECUTION_CARRIER="$GITHUB_SHA"
            PR_CHECKED_OUT_HEAD="$ACTUAL_HEAD"
            mapfile -t COMMIT_IDENTITY < <(python3 - <<'PY'
          import subprocess

          proc = subprocess.run(
              ["git", "cat-file", "-p", "HEAD"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              check=False,
          )

          if proc.returncode:
              raise SystemExit("synthetic merge commit object unavailable")

          raw = proc.stdout
          separator = raw.find(b"\n\n")

          if separator < 0:
              raise SystemExit("synthetic merge commit header invalid")

          header = raw[:separator]

          trees = []
          parents = []

          for line in header.splitlines():
              if line.startswith(b"tree "):
                  trees.append(line[5:])
              elif line.startswith(b"parent "):
                  parents.append(line[7:])
              elif line.startswith((b"tree", b"parent")):
                  raise SystemExit("synthetic merge commit header invalid")

          if len(trees) != 1:
              raise SystemExit("synthetic merge tree cardinality invalid")

          if len(parents) != 2:
              raise SystemExit("synthetic merge parent cardinality invalid")

          values = (trees[0], parents[0], parents[1])
          decoded = []

          for value in values:
              try:
                  sha = value.decode("ascii")
              except UnicodeDecodeError as exc:
                  raise SystemExit("synthetic merge SHA invalid") from exc

              if (
                  len(sha) != 40
                  or sha != sha.lower()
                  or any(ch not in "0123456789abcdef" for ch in sha)
              ):
                  raise SystemExit("synthetic merge SHA invalid")

              decoded.append(sha)

          for value in decoded:
              print(value)
          PY
            )
            if [ "${#COMMIT_IDENTITY[@]}" -ne 3 ]; then
              printf 'PR_EXECUTION_COMMIT_IDENTITY_CARDINALITY_INVALID=%s\n' "${#COMMIT_IDENTITY[@]}" >&2
              exit 1
            fi

            PR_EXECUTION_TREE="${COMMIT_IDENTITY[0]}"
            PR_EXECUTION_PARENT_1="${COMMIT_IDENTITY[1]}"
            PR_EXECUTION_PARENT_2="${COMMIT_IDENTITY[2]}"
            require_sha40 "$PR_EXECUTION_CARRIER" "PR_EXECUTION_CARRIER"
            require_sha40 "$PR_CHECKED_OUT_HEAD" "PR_CHECKED_OUT_HEAD"
            require_sha40 "$PR_EXECUTION_PARENT_1" "PR_EXECUTION_PARENT_1"
            require_sha40 "$PR_EXECUTION_PARENT_2" "PR_EXECUTION_PARENT_2"
            require_sha40 "$PR_EXECUTION_TREE" "PR_EXECUTION_TREE"

            if [ "$PR_EXECUTION_CARRIER" != "$PR_CHECKED_OUT_HEAD" ]; then
              printf 'PR_EXECUTION_CARRIER_MISMATCH carrier=%s checkout=%s\n' "$PR_EXECUTION_CARRIER" "$PR_CHECKED_OUT_HEAD" >&2
              exit 1
            fi
            if [ "$PR_EXECUTION_PARENT_1" != "$EVENT_BASE_SHA" ]; then
              printf 'PR_EXECUTION_PARENT_1_MISMATCH actual=%s expected=%s\n' "$PR_EXECUTION_PARENT_1" "$EVENT_BASE_SHA" >&2
              exit 1
            fi
            if [ "$PR_EXECUTION_PARENT_2" != "$EVENT_HEAD_SHA" ]; then
              printf 'PR_EXECUTION_PARENT_2_MISMATCH actual=%s expected=%s\n' "$PR_EXECUTION_PARENT_2" "$EVENT_HEAD_SHA" >&2
              exit 1
            fi
            if [ "$PR_EXECUTION_TREE" != "$PR_CANDIDATE_TREE" ]; then
              printf 'PR_EXECUTION_TREE_MISMATCH execution=%s candidate=%s\n' "$PR_EXECUTION_TREE" "$PR_CANDIDATE_TREE" >&2
              exit 1
            fi

            printf 'CHECKED_OUT_HEAD=%s\n' "$ACTUAL_HEAD"
            printf 'PR_CANDIDATE_IDENTITY=%s\n' "$EVENT_HEAD_SHA"
            printf 'PR_BASE_IDENTITY=%s\n' "$EVENT_BASE_SHA"
            printf 'PR_EXECUTION_CARRIER=%s\n' "$PR_EXECUTION_CARRIER"
            printf 'PR_CHECKED_OUT_HEAD=%s\n' "$PR_CHECKED_OUT_HEAD"
            printf 'PR_EXECUTION_PARENT_1=%s\n' "$PR_EXECUTION_PARENT_1"
            printf 'PR_EXECUTION_PARENT_2=%s\n' "$PR_EXECUTION_PARENT_2"
            printf 'PR_CANDIDATE_TREE=%s\n' "$PR_CANDIDATE_TREE"
            printf 'PR_EXECUTION_TREE=%s\n' "$PR_EXECUTION_TREE"
            printf '%s\n' 'DUAL_CARRIER_BINDING=PASS'
          fi
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('cyber_lion/contracts').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('parsed', path)
          PY
      - name: Compile Cyber-Lion package
        run: python -m compileall -q cyber_lion
      - name: Run Cyber-Lion tests
        run: python -m unittest discover -s cyber_lion/tests -p "test_*.py" -v
      - name: R2E3 targeted fleet live pin tests
        if: github.event_name == 'pull_request' && github.head_ref == 'mission/r2e3-fleet-registry-pin-live-source-binding'
        run: python -m unittest cyber_lion.tests.test_fleet_registry_pin_live_source -v
      - name: R2E3 real 10-repository read-only GitHub sweep
        if: github.event_name == 'pull_request' && github.head_ref == 'mission/r2e3-fleet-registry-pin-live-source-binding'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2E3_LIVE_FLEET_SWEEP: "1"
        run: python -m unittest cyber_lion.tests.test_fleet_registry_pin_live_source.FleetRegistryPinLiveSourceTests.test_real_ten_repository_read_only_github_sweep -v
      - name: R2E3 frozen inventory receipt
        if: github.event_name == 'pull_request' && github.head_ref == 'mission/r2e3-fleet-registry-pin-live-source-binding'
        run: |
          python -m unittest cyber_lion.tests.test_host_authority_separation.HostAuthoritySeparationTests.test_effect_surface_and_exact_terminal_inventory -v
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from cyber_lion.enterprise.complete_mediation import EffectSurfaceScanner
          from cyber_lion.enterprise.host_authority_separation import _production_path

          raw = subprocess.run(
              ['git', 'ls-files', '-z'],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          ).stdout
          sources = {}
          for item in raw.split(b'\0'):
              if not item:
                  continue
              path = item.decode()
              if _production_path(path):
                  sources[path] = Path(path).read_text()
          revision = subprocess.run(
              ['git', 'rev-parse', 'HEAD'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          tree = subprocess.run(
              ['git', 'write-tree'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          inventory = EffectSurfaceScanner().scan(
              repository='DonkeyJJLove/ai_platform',
              revision=revision,
              tree_digest=tree,
              sources=sources,
          )
          values = (len(sources), len(inventory.surfaces), len(inventory.unclassified_refs))
          print(f'SOURCE_COUNT={values[0]}')
          print(f'EFFECT_SURFACE_COUNT={values[1]}')
          print(f'UNCLASSIFIED_COUNT={values[2]}')
          if values != (241, 225, 5):
              raise SystemExit(f'R2E3_INVENTORY_DRIFT={values}')
          print('INVENTORY_REFREEZE=PASS')
          PY
      - name: R2E4 implementation static validation
        if: (github.event_name == 'pull_request' && github.head_ref == 'mission/r2e4-fleet-manifest-exact-head-semantic-binding') || (github.event_name == 'push' && github.ref == 'refs/heads/mission/r2e4-fleet-manifest-exact-head-semantic-binding')
        run: |
          python -m compileall -q cyber_lion
          python -m unittest cyber_lion.tests.test_fleet_registry_pin_live_source -v
          python -m unittest cyber_lion.tests.test_enterprise_federation -v
          python -m unittest cyber_lion.tests.test_rccm_1d_glitchlab_conformance -v
      - name: R2E4 real 10-repository exact-head manifest semantic sweep
        if: (github.event_name == 'pull_request' && github.head_ref == 'mission/r2e4-fleet-manifest-exact-head-semantic-binding') || (github.event_name == 'push' && github.ref == 'refs/heads/mission/r2e4-fleet-manifest-exact-head-semantic-binding')
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R2E4_LIVE_MANIFEST_SWEEP: "1"
        run: python -m unittest cyber_lion.tests.test_fleet_registry_pin_live_source.FleetRegistryPinLiveSourceTests.test_real_ten_repository_exact_head_manifest_semantic_sweep -v
      - name: R2E4 frozen inventory receipt
        if: (github.event_name == 'pull_request' && github.head_ref == 'mission/r2e4-fleet-manifest-exact-head-semantic-binding') || (github.event_name == 'push' && github.ref == 'refs/heads/mission/r2e4-fleet-manifest-exact-head-semantic-binding')
        run: |
          python -m unittest cyber_lion.tests.test_host_authority_separation.HostAuthoritySeparationTests.test_effect_surface_and_exact_terminal_inventory -v
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from cyber_lion.enterprise.complete_mediation import EffectSurfaceScanner
          from cyber_lion.enterprise.host_authority_separation import _production_path

          raw = subprocess.run(
              ['git', 'ls-files', '-z'],
              check=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          ).stdout
          sources = {}
          for item in raw.split(b'\0'):
              if not item:
                  continue
              path = item.decode()
              if _production_path(path):
                  sources[path] = Path(path).read_text()
          revision = subprocess.run(
              ['git', 'rev-parse', 'HEAD'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          tree = subprocess.run(
              ['git', 'write-tree'],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          inventory = EffectSurfaceScanner().scan(
              repository='DonkeyJJLove/ai_platform',
              revision=revision,
              tree_digest=tree,
              sources=sources,
          )
          values = (len(sources), len(inventory.surfaces), len(inventory.unclassified_refs))
          print(f'R2E4_SOURCE_COUNT={values[0]}')
          print(f'R2E4_EFFECT_SURFACE_COUNT={values[1]}')
          print(f'R2E4_UNCLASSIFIED_COUNT={values[2]}')
          if values != (241, 225, 5):
              raise SystemExit(f'R2E4_INVENTORY_DRIFT={values}')
          print('R2E4_INVENTORY_REFREEZE=PASS')
          PY
      - name: Run Startup Evolution demo
        run: python -m cyber_lion.startup_agent.demo > /tmp/startup-agent-demo.json

  merge-authority-admission:
    name: Cyber-Lion Merge Authority Admission
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Emit literal merge authority identity evidence
        shell: bash
        run: |
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          if [ "$ACTUAL_HEAD" != "$GITHUB_SHA" ]; then
            printf 'CHECKED_OUT_HEAD_MISMATCH actual=%s expected=%s\n' "$ACTUAL_HEAD" "$GITHUB_SHA" >&2
            exit 1
          fi
          printf '%s\n' 'JOB_NAME=Cyber-Lion Merge Authority Admission'
          printf 'CHECKED_OUT_HEAD=%s\n' "$ACTUAL_HEAD"
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Compile merge admission boundary
        run: python -m compileall -q cyber_lion/enterprise/merge_admission.py
      - name: Verify fail-closed merge authority admission
        run: python -m unittest cyber_lion.tests.test_merge_admission -v
      - name: Emit merge admission terminal evidence
        shell: bash
        run: |
          printf '%s\n' 'MERGE_ADMISSION_TERMINAL=OK'
          printf '%s\n' 'NO_MERGE_AUTHORIZATION_INFERRED=YES'
