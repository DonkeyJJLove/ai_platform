name: Cyber-Lion Core
on:
  workflow_dispatch:
  pull_request:
    paths: ["cyber_lion/**", ".github/workflows/cyber-lion-contracts.yml", "README.md"]
  push:
    branches: ["master", "cyber-lion/**"]
    paths: ["cyber_lion/**", ".github/workflows/cyber-lion-contracts.yml", "README.md"]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - name: Parse JSON schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('cyber_lion/contracts').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print('parsed', path)
          PY
      - name: Compile Cyber-Lion package
        run: python -m compileall -q cyber_lion
      - name: Run Cyber-Lion tests
        run: python -m unittest discover -s cyber_lion/tests -p "test_*.py" -v
      - name: Run Startup Evolution demo
        run: python -m cyber_lion.startup_agent.demo > /tmp/startup-agent-demo.json
