name: Bandit Security Scan

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bandit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-python:
    name: Scan Python
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pinned Bandit
        run: python -m pip install --disable-pip-version-check bandit==1.9.4

      - name: Scan production Python
        run: bandit --recursive cyber_lion --exclude cyber_lion/tests --severity-level medium --confidence-level medium
