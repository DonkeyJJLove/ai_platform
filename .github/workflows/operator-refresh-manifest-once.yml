name: LION Operator Manifest Refresh Once

on:
  push:
    branches: ["mission/operator-intervention-r1"]
    paths:
      - ".github/workflows/operator-refresh-manifest-once.yml"

permissions:
  contents: write

concurrency:
  group: lion-operator-manifest-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recompute exact Mission Control package manifest
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib
          import re
          from pathlib import Path
          from cyber_lion.tests import test_mission_control_v3_restart_package as package_test
          observed={name:hashlib.sha256(source.read_bytes()).hexdigest() for name,source in package_test.SOURCE_MAP.items()}
          broker=Path('tools/lion_effect_admission_broker.py')
          text=broker.read_text(encoding='utf-8')
          replacement='MISSION_CONTROL_V3_REQUIRED_SHA256='+repr(dict(sorted(observed.items())))+'\n'
          updated,count=re.subn(r'^MISSION_CONTROL_V3_REQUIRED_SHA256=.*?(?=^MISSION_CONTROL_V3_PATH=)',replacement,text,count=1,flags=re.MULTILINE|re.DOTALL)
          if count!=1:raise SystemExit('manifest replacement cardinality')
          broker.write_text(updated,encoding='utf-8')
          print('PACKAGE_FILES',len(observed))
          print('PROVISION_SHA256',observed['lion_operator_provision.py'])
          PY
          rm -f .github/workflows/operator-refresh-manifest-once.yml

      - name: Compile and regress operator control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/lion_effect_admission_broker.py tools/lion_operator_provision.py
          python3 -m unittest \
            cyber_lion.tests.test_operator_control \
            cyber_lion.tests.test_operator_gateway \
            cyber_lion.tests.test_operator_full_sat \
            cyber_lion.tests.test_operator_backpressure \
            cyber_lion.tests.test_operator_capability_registry \
            cyber_lion.tests.test_operator_client \
            cyber_lion.tests.test_operator_containment_helper \
            cyber_lion.tests.test_operator_effect_boundary \
            cyber_lion.tests.test_operator_panel_security \
            cyber_lion.tests.test_operator_worker_delivery \
            cyber_lion.tests.test_local_assignment_worker \
            cyber_lion.tests.test_scheduler_storage_reconciliation \
            cyber_lion.tests.test_operator_provision \
            cyber_lion.tests.test_mission_control_v3_restart_package
          git diff --check

      - name: Commit refreshed exact manifest
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/operator-refresh-manifest-once.yml
          git config user.name 'LION Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'LION: enforce expiring SentinelX proxy grant'
          git push origin HEAD:mission/operator-intervention-r1
