name: R24 bounded candidate materializer

on:
  push:
    branches:
      - mission/lion-v1.4-r24-repository-ref-authority-provisioning-r1
    paths:
      - .lion/r24-bootstrap/GO

permissions:
  contents: write

concurrency:
  group: r24-bounded-candidate-materializer
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact validated R24 tree
        shell: bash
        run: |
          set -euo pipefail
          BASE="67a4f8243aa6805e47035e572bd458f73fd0b358"
          BRANCH="mission/lion-v1.4-r24-repository-ref-authority-provisioning-r1"
          PATCH_URL="https://drop.pensa.ar/f/Iv3L1QricDUin/r24-candidate.patch"
          PATCH_SHA256="d961022f0a002cecc927ccad9b7076ca1a7e4f379b887e1ff83b6314ddb4d766"
          FINAL_TREE="a076d6e6adcbcc10cb2821115d56f9d1bf8d2380"
          test "${GITHUB_REF_NAME}" = "${BRANCH}"
          git fetch --no-tags origin master
          test "$(git rev-parse origin/master)" = "${BASE}"
          bad="$(git diff --name-only "${BASE}"..HEAD | grep -Ev "^(\.lion/r24-bootstrap/|\.github/workflows/r24-bounded-bootstrap\.yml$)" || true)"
          test -z "${bad}"
          curl --fail --silent --show-error --location "${PATCH_URL}" -o /tmp/r24-candidate.patch
          echo "${PATCH_SHA256}  /tmp/r24-candidate.patch" | sha256sum -c -
          git rm -r .lion/r24-bootstrap .github/workflows/r24-bounded-bootstrap.yml
          git apply --index --binary /tmp/r24-candidate.patch
          git add -A
          git diff --cached --check
          test "$(git write-tree)" = "${FINAL_TREE}"
          python3 -m compileall -q cyber_lion tools
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "R24: bind repository-ref delete authority to exact resource"
          test "$(git rev-parse HEAD^{tree})" = "${FINAL_TREE}"
          git push origin "HEAD:refs/heads/${BRANCH}"
