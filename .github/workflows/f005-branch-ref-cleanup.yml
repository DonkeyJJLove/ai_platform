name: F005 Exact Branch Ref Cleanup

on:
  pull_request:
    branches:
      - master
    paths:
      - .lion/control/f005-branch-ref-cleanup.request.json
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout cleanup control request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request and delete exact stale F005 refs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          $ErrorActionPreference = 'Stop'
          $requestPath = '.lion/control/f005-branch-ref-cleanup.request.json'
          if ($env:PR_HEAD_REPO -ne $env:GITHUB_REPOSITORY) { throw 'foreign repository denied' }
          if ($env:PR_HEAD_REF -ne 'control/f005-branch-ref-cleanup') { throw 'control branch substitution denied' }
          if ($env:PR_BASE_REF -ne 'master') { throw 'base branch substitution denied' }
          if ($env:PR_HEAD_SHA -notmatch '^[0-9a-f]{40}$' -or $env:PR_BASE_SHA -notmatch '^[0-9a-f]{40}$') { throw 'invalid PR sha binding' }

          git fetch --no-tags origin $env:PR_BASE_SHA $env:PR_HEAD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'exact PR fetch failed' }
          $changed = @(git diff --name-only $env:PR_BASE_SHA $env:PR_HEAD_SHA)
          if ($changed.Count -ne 1 -or $changed[0] -ne $requestPath) { throw 'cleanup transport must change exactly the request path' }

          $requestRaw = git show "$($env:PR_HEAD_SHA):$requestPath"
          if ($LASTEXITCODE -ne 0) { throw 'cleanup request missing' }
          $request = (($requestRaw -join "`n") | ConvertFrom-Json -ErrorAction Stop)
          $required = @('schema_version','request_id','expected_master','expected_master_tree','cleanup_build_head')
          $actual = @($request.PSObject.Properties.Name | Sort-Object)
          if (($actual -join ',') -ne (($required | Sort-Object) -join ',')) { throw 'cleanup request schema substitution denied' }
          if ($request.schema_version -ne 'lion.f005-branch-ref-cleanup/v1') { throw 'unsupported cleanup request schema' }
          if ($request.request_id -notmatch '^[0-9a-f]{64}$') { throw 'request_id must be sha256' }
          if ($request.expected_master -notmatch '^[0-9a-f]{40}$' -or $request.expected_master_tree -notmatch '^[0-9a-f]{40}$' -or $request.cleanup_build_head -notmatch '^[0-9a-f]{40}$') { throw 'git bindings must be exact sha1 values' }

          $canonical = "schema_version=lion.f005-branch-ref-cleanup/v1`nexpected_master=$($request.expected_master)`nexpected_master_tree=$($request.expected_master_tree)`ncleanup_build_head=$($request.cleanup_build_head)`n"
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try { $digest = $sha256.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($canonical)) }
          finally { $sha256.Dispose() }
          $computed = ([System.BitConverter]::ToString($digest)).Replace('-', '').ToLowerInvariant()
          if ($computed -ne $request.request_id) { throw 'cleanup request_id payload binding mismatch' }

          git fetch --no-tags origin master
          if ($LASTEXITCODE -ne 0) { throw 'live master fetch failed' }
          $liveMaster = (git rev-parse refs/remotes/origin/master).Trim()
          $liveTree = (git show -s --format=%T $liveMaster).Trim()
          if ($liveMaster -ne $request.expected_master -or $liveTree -ne $request.expected_master_tree) { throw 'live master/tree drift denied' }
          if ($env:PR_BASE_SHA -ne $liveMaster) { throw 'stale cleanup PR base denied' }

          $refs = [ordered]@{
            'control/f005-runtime-concurrency-cancel' = '2f460d41ce4f10b203d5838658801a5f01863c94'
            'control/f005-runtime-concurrency-inspector' = '6c140a944fa3dcfec4a902f108977f933f1eb3e4'
            'control/f005-runtime-convergence' = 'db1749d60d8068e8fe013eaa3361d16710064f1c'
            'mission/f005-admission-windows-path-literals' = '755d0e3d0050b0084c7f3950a114146f802ddcb0'
            'mission/f005-concurrency-cancel' = '18c811776e93c55d54de6439840c1ed52eaf8a4a'
            'mission/f005-concurrency-cancel-r2' = '006992683d540f6725c5faef41acc7c06bb0c17d'
            'mission/f005-concurrency-cancel-r3' = 'ededd1628b9b1f0a2eece5ceb7e35590c3ecb83e'
            'mission/f005-concurrency-inspector' = 'b16d503ba2993a98a02ef6317fdd1a996e8ec3b2'
            'mission/f005-l-r2-canonical-branch-ownership-registry-refresh' = '8dca85de73103957a1cc6db76621f9f6dc77a094'
            'mission/f005-l-r3-ancestry-contract-binding-repair' = 'cab36e8adafa6c522ae1e14bd3c77d77b1966e50'
            'mission/f005-o-closure-preconditions-provider' = '762e02a4bf8f8dcefbaf4b5f279f030868231dbe'
            'mission/f005-o-r2-pre-report-provenance-repair' = 'cd70efc37ff81e84906a2f312672eb456b6bb968'
            'mission/f005-o-r3-clean-post-report-race-binding' = '31214e8b81746c3db3cae45ecff2b98a205f3a7c'
            'mission/f005-o-r3-post-report-race-binding-repair' = '6a7b11425da3f82ff32a18b651633f938a16a922'
            'mission/f005-o-r4-exact-pre-report-evidence' = 'a3ffe803ec84422fd67cec37ed7c301eaefeab9f'
            'mission/f005-p-r2-current-master-rebaseline' = '816eb9c5e92e1bdd03397b0e056db37f2385e7af'
            'mission/f005-p-recorded-inventory-reconciliation' = '390f5a8028878db7454a8ea36d44270fce2acbff'
            'mission/f005-pr-control-plane' = 'aa9d56610bfe78d82d6d63b6ad4eff785e73fc0d'
            'mission/f005-pre-runtime-admission-locator' = 'a775695729859df5a59d62080b6f1689cdbba9c3'
            'mission/f005-q-runtime-preflight-observer' = 'd1e208c21439679d3851b70e8fe9b3eb7c01757c'
            'mission/f005-q-runtime-preflight-r2-atomic-observation' = '930aae96d5d8aca971f590ead00bbac4fa9a0d29'
            'mission/f005-q-runtime-preflight-r2-clean-atomic-observation' = '0431e74f843275c010f161a7b5829da3a9c0bb33'
            'mission/f005-q-runtime-reconciliation-execution' = '46e46b30a541165f60acf18b904062b35e18a737'
            'mission/f005-r11-next-reconciliation-epoch' = '6e822580035277574bbf83f313f66ef2d3e16863'
            'mission/f005-remove-runtime-diagnostic' = 'a14c8b4dde6a9a6268fccd26e3654cce6ea9c6c5'
            'mission/f005-runtime-quarantine-control' = '046a6a1be40dc540a8a07e3b85633850a0091e5e'
            'mission/f005-runtime-quarantine-cutover' = '6bedf2a50e4cab6472d50830cb1ea61e9784fe72'
            'mission/f005-runtime-run-locator' = '6e709d25cfe4dd8587734745362b1f1808428067'
            'mission/f005-sandbox-runtime-trigger' = 'b450fae7c4f603039dc7e25c924fc7bb754c622f'
            'mission/f005-branch-ref-cleanup' = 'dc7cfaf3f874b93f46e159f197accbef816f49c6'
            'mission/f005-branch-ref-cleanup-r2' = $request.cleanup_build_head
          }

          if ($refs.Keys -contains 'master' -or $refs.Keys -contains $env:PR_HEAD_REF) { throw 'protected/current control ref entered cleanup set' }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Get-RefGetUri([string]$branch) {
            $segments = @($branch -split '/' | ForEach-Object { [System.Uri]::EscapeDataString($_) })
            $branchPath = $segments -join '/'
            return "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/ref/heads/$branchPath"
          }
          function Get-RefDeleteUri([string]$branch) {
            $segments = @($branch -split '/' | ForEach-Object { [System.Uri]::EscapeDataString($_) })
            $branchPath = $segments -join '/'
            return "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/git/refs/heads/$branchPath"
          }

          $deleted = @()
          $alreadyAbsent = @()
          foreach ($entry in $refs.GetEnumerator()) {
            $branch = [string]$entry.Key
            $expectedSha = [string]$entry.Value
            $refGetUri = Get-RefGetUri $branch
            $refDeleteUri = Get-RefDeleteUri $branch
            try {
              $ref = Invoke-RestMethod -Method Get -Headers $headers -Uri $refGetUri
            }
            catch {
              if ($_.Exception.Response.StatusCode.value__ -eq 404) { $alreadyAbsent += $branch; continue }
              throw
            }
            if ($ref.object.sha -ne $expectedSha) { throw "ref drift denied: $branch $($ref.object.sha) != $expectedSha" }

            $headQuery = [System.Uri]::EscapeDataString("DonkeyJJLove:$branch")
            $openPrUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls?state=open&head=$headQuery&per_page=2"
            $openPrResponse = Invoke-RestMethod -Method Get -Headers $headers -Uri $openPrUri
            if ($null -ne $openPrResponse -and @($openPrResponse).Count -ne 0) { throw "open PR still owns ref: $branch" }

            Invoke-RestMethod -Method Delete -Headers $headers -Uri $refDeleteUri
            $deleted += $branch
          }

          $statusBody = @{
            state = 'success'
            context = 'lion/f005-branch-ref-cleanup'
            description = "deleted=$($deleted.Count) absent=$($alreadyAbsent.Count)"
            target_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$liveMaster" -Body $statusBody -ContentType 'application/json'

          "deleted=$($deleted.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "already_absent=$($alreadyAbsent.Count)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

          $closeBody = @{ state = 'closed' } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Patch -Headers $headers -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/pulls/$env:PR_NUMBER" -Body $closeBody -ContentType 'application/json'

          $controlGetUri = Get-RefGetUri $env:PR_HEAD_REF
          $controlDeleteUri = Get-RefDeleteUri $env:PR_HEAD_REF
          $controlRef = Invoke-RestMethod -Method Get -Headers $headers -Uri $controlGetUri
          if ($controlRef.object.sha -ne $env:PR_HEAD_SHA) { throw 'control branch drift before self-delete' }
          Invoke-RestMethod -Method Delete -Headers $headers -Uri $controlDeleteUri
