          print(f"R2E3_WRITEUPS_MANIFEST_PRESENT={live['R2E3_WRITEUPS_MANIFEST_PRESENT']}")
          for member in live["R2E3_MEMBERS"]:
              print(f"R2E3_MEMBER={member}")
