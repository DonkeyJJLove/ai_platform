          print(f"TARGETED_EXIT_CODE={targeted['TARGETED_EXIT_CODE']}")
          print(f"TARGETED_TEST_COUNT={targeted['TARGETED_TEST_COUNT']}")
          print(f"TARGETED_SKIPPED={targeted['TARGETED_SKIPPED']}")
          print("TARGETED_RESULT=PASS")
          print("R2E3_LIVE_FLEET_SWEEP=PASS")
          print(f"R2E3_LIVE_MEMBER_COUNT={live['R2E3_LIVE_MEMBER_COUNT']}")
          print(f"R2E3_REGISTRY_DIGEST={live['R2E3_REGISTRY_DIGEST']}")
