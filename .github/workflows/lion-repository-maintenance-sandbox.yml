name: LION Repository Maintenance Sandbox

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: lion-repository-maintenance-sandbox
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.issue.number == 144 &&
      github.event.comment.body == 'LION-BRANCH-CLEANUP v1' &&
      github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute bounded branch cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python -m cyber_lion.enterprise.repository_maintenance_cleanup \
            --execute-cleanup | tee /tmp/lion-maintenance.log
          python - <<'PY'
          import json
          from pathlib import Path
          lines = Path('/tmp/lion-maintenance.log').read_text(encoding='utf-8').splitlines()
          marker = 'LION_REPOSITORY_MAINTENANCE_RESULT '
          matches = [line[len(marker):] for line in lines if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit('expected exactly one maintenance result')
          value = json.loads(matches[0])
          Path('lion-repository-maintenance-result.json').write_text(
              json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Post bounded maintenance observation receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import urllib.request

          path = Path('lion-repository-maintenance-result.json')
          raw = path.read_bytes()
          result = json.loads(raw)
          result_digest = hashlib.sha256(raw).hexdigest()
          retained_names = ','.join(result.get('final_branches', []))
          body = '\n'.join([
              'LION-REPOSITORY-MAINTENANCE-OBSERVATION-RECEIPT v1',
              f"run_id={os.environ['GITHUB_RUN_ID']}",
              f"run_attempt={os.environ['GITHUB_RUN_ATTEMPT']}",
              f"master_before={result['master_before']}",
              f"master_after={result['master_after']}",
              f"initial_non_master_count={result['initial_non_master_count']}",
              f"deleted_count={result['deleted_count']}",
              f"retained_count={result['retained_count']}",
              f"final_branches={retained_names}",
              f"result_sha256={result_digest}",
              'authority_effect=false',
              'master_effect=false',
              'observation_result=OBSERVED_VERIFIED',
          ])
          payload = json.dumps({'body': body}, separators=(',', ':')).encode()
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/144/comments"
          request = urllib.request.Request(
              url,
              data=payload,
              method='POST',
              headers={
                  'Authorization': f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
                  'User-Agent': 'lion-repository-maintenance-observer/1',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 201:
                  raise SystemExit(f'failed to post maintenance observation: {response.status}')
          PY

      - name: Upload maintenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: lion-repository-maintenance-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: lion-repository-maintenance-result.json
          if-no-files-found: error
          retention-days: 30
