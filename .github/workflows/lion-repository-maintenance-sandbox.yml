name: LION Repository Maintenance Sandbox

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: lion-repository-maintenance-sandbox
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      github.event.issue.number == 144 &&
      startsWith(github.event.comment.body, 'LION-REPOSITORY-REF-DELETE v2')
    runs-on: [self-hosted, linux, lion-trust-client]
    timeout-minutes: 20
    env:
      LION_MAINTENANCE_BUNDLE_URL: ${{ vars.LION_MAINTENANCE_BUNDLE_URL }}
      LION_MAINTENANCE_BUNDLE_TOKEN: ${{ secrets.LION_MAINTENANCE_BUNDLE_TOKEN }}
      LION_MAINTENANCE_RUNTIME_MODULE_PATH: ${{ vars.LION_MAINTENANCE_RUNTIME_MODULE_PATH }}
      LION_MAINTENANCE_RUNTIME_MODULE_DIGEST: ${{ vars.LION_MAINTENANCE_RUNTIME_MODULE_DIGEST }}
      LION_REPOSITORY_DELETE_FENCE_DATABASE_PATH: ${{ vars.LION_REPOSITORY_DELETE_FENCE_DATABASE_PATH }}
    steps:
      - name: Validate repository-owner request actor
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text(encoding='utf-8'))
          comment = event.get('comment') or {}
          repository = event.get('repository') or {}
          owner = repository.get('owner') or {}
          actor = comment.get('user') or {}
          if actor.get('login') != owner.get('login'):
              raise SystemExit('repository-owner request actor required')
          PY

      - name: Checkout exact master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Observe exact master tree
        id: gitstate
        shell: bash
        run: |
          set -euo pipefail
          echo "tree=$(git rev-parse HEAD^{tree})" >> "$GITHUB_OUTPUT"

      - name: Execute canonical mediated exact branch-ref delete
        id: execute
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -uo pipefail
          stdout_file="$RUNNER_TEMP/lion-maintenance.stdout"
          stderr_file="$RUNNER_TEMP/lion-maintenance.stderr"
          set +e
          python -m cyber_lion.enterprise.repository_maintenance_mediated_cleanup \
            --execute-exact-request \
            --expected-master "$GITHUB_SHA" \
            --expected-tree "${{ steps.gitstate.outputs.tree }}" \
            >"$stdout_file" 2>"$stderr_file"
          rc=$?
          set -e
          cat "$stdout_file"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -ne 0 ]; then
            cat "$stderr_file" >&2
            exit "$rc"
          fi
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'lion-maintenance.stdout'
          lines = path.read_text(encoding='utf-8').splitlines()
          marker = 'LION_REPOSITORY_MAINTENANCE_RESULT '
          matches = [line[len(marker):] for line in lines if line.startswith(marker)]
          if len(matches) != 1:
              raise SystemExit('expected exactly one mediated maintenance result')
          value = json.loads(matches[0])
          if value.get('fence_state') != 'RECONCILED':
              raise SystemExit('mediated maintenance did not reconcile')
          Path('lion-repository-maintenance-result.json').write_text(
              json.dumps(value, sort_keys=True, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Post bounded maintenance failure receipt
        if: ${{ failure() && steps.execute.outcome == 'failure' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m cyber_lion.enterprise.repository_maintenance_receipt \
            --kind failure \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --checked-out-sha "$GITHUB_SHA" \
            --exit-code "${{ steps.execute.outputs.rc }}" \
            --stderr "$RUNNER_TEMP/lion-maintenance.stderr"

      - name: Post bounded maintenance observation receipt
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python -m cyber_lion.enterprise.repository_maintenance_receipt \
            --kind observation \
            --event "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --token-env GITHUB_TOKEN \
            --checked-out-sha "$GITHUB_SHA" \
            --result lion-repository-maintenance-result.json

      - name: Upload maintenance receipt
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: lion-repository-maintenance-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: lion-repository-maintenance-result.json
          if-no-files-found: error
          retention-days: 30
