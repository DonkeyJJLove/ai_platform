name: LION Exact Repair Publish PR337

on:
  push:
    branches:
      - repair/epoch3-panel-publication-staging-r1
    paths:
      - .github/workflows/lion-exact-repair-publish-pr.yml

permissions:
  contents: write

concurrency:
  group: lion-exact-repair-publish-pr337-r1
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, lion-trust-client]
    timeout-minutes: 10
    steps:
      - name: Checkout isolated staging ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact candidate and fast-forward PR337 head only
        shell: bash
        run: |
          set -euo pipefail

          STAGING='repair/epoch3-panel-publication-staging-r1'
          READY='repair/epoch3-panel-publication-ready-r1'
          PR_BRANCH='mission/epoch3-closure-docs-federation-r1'
          OLD='2309e33e1f141aaf4ddb0a0dd521c4abb6e6cc3d'
          LOCAL='6228ec8344480c9a2c1cb95199986bfb500037f0'
          TREE='a508165d183bfea5004c155434ae9ff658206cc8'
          SRC='/var/lib/sentinelx/uploads/epoch3-receipt-panel-repair-r1/ai_platform'

          test "${GITHUB_REF_NAME}" = "${STAGING}"
          test -d "${SRC}/.git"
          test "$(git -C "${SRC}" rev-parse HEAD)" = "${LOCAL}"
          test "$(git -C "${SRC}" rev-parse 'HEAD^{tree}')" = "${TREE}"
          test -z "$(git -C "${SRC}" status --porcelain)"
          git -C "${SRC}" merge-base --is-ancestor "${OLD}" "${LOCAL}"

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          git -C "${SRC}" archive --format=tar "${LOCAL}" | tar -xf - -C "${tmp}"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "${tmp}/." .
          git add -A
          test "$(git write-tree)" = "${TREE}"

          ready_remote="$(git ls-remote origin "refs/heads/${READY}" | awk '{print $1}')"
          if [ -n "${ready_remote}" ]; then
            git fetch --no-tags origin "${READY}:refs/remotes/origin/${READY}"
            commit="$(git rev-parse "refs/remotes/origin/${READY}")"
            test "$(git rev-parse "${commit}^{tree}")" = "${TREE}"
            test "$(git rev-parse "${commit}^")" = "${OLD}"
          else
            export GIT_AUTHOR_NAME='LION Publication Bot'
            export GIT_AUTHOR_EMAIL='lion-publication@users.noreply.github.com'
            export GIT_COMMITTER_NAME='LION Publication Bot'
            export GIT_COMMITTER_EMAIL='lion-publication@users.noreply.github.com'
            commit="$(printf '%s\n\n%s\n' \
              'Epoch3: repair restart receipts and panel SaaS threading' \
              'Materialized from validated repair candidate 6228ec8344480c9a2c1cb95199986bfb500037f0 with exact tree a508165d183bfea5004c155434ae9ff658206cc8.' \
              | git commit-tree "${TREE}" -p "${OLD}")"
            test "$(git rev-parse "${commit}^{tree}")" = "${TREE}"
            test "$(git rev-parse "${commit}^")" = "${OLD}"
            git push origin "${commit}:refs/heads/${READY}"
          fi

          test "$(git rev-parse "${commit}^{tree}")" = "${TREE}"
          test "$(git rev-parse "${commit}^")" = "${OLD}"

          pr_remote="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}')"
          if [ "${pr_remote}" = "${OLD}" ]; then
            git push origin "${commit}:refs/heads/${PR_BRANCH}"
          elif [ "${pr_remote}" = "${commit}" ]; then
            echo 'PR337 head is already the exact publication commit.'
          else
            echo "PR337 head drift: ${pr_remote}" >&2
            exit 1
          fi

          after="$(git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}')"
          test "${after}" = "${commit}"
          git fetch --no-tags origin "${commit}"
          test "$(git rev-parse "${commit}^{tree}")" = "${TREE}"
          test "$(git rev-parse "${commit}^")" = "${OLD}"

          {
            echo '### PR337 exact-tree fast-forward'
            echo "- publication commit: ${commit}"
            echo "- parent: ${OLD}"
            echo "- tree: ${TREE}"
            echo "- local validated source: ${LOCAL}"
            echo '- force push: false'
            echo '- merge: not performed'
          } >> "${GITHUB_STEP_SUMMARY}"
