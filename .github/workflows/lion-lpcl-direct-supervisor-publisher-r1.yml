name: LION LPCL Direct Supervisor Publisher R1
on:
  push:
    branches: [bootstrap/lion-lpcl-direct-supervisor-r1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0e696b504233fb96b6d128e054001834cbf56650
          fetch-depth: 0
      - name: Verify exact superseded candidate parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e696b504233fb96b6d128e054001834cbf56650"
          test "$(git rev-parse HEAD^{tree})" = "1aad394f9f00411241d057913eaf1fe0522e9c85"
          test "$(git status --porcelain)" = ""
      - name: Materialize exact retry-hardened candidate tree
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://drop.pensa.ar/f/hpSUf3TAENGAz/lion-direct-final-fastforward.patch.gz' -o /tmp/lion.patch.gz
          echo '0f1606f6cb855c1b8c4e7168ff3f08999a2dd0c496ca1d6d9c5e3ba36aa1f95e  /tmp/lion.patch.gz' | sha256sum -c -
          gzip -dc /tmp/lion.patch.gz > /tmp/lion.patch
          echo '563d626ae07e2e0a89dd46972c63d16cc9df31a238456e6307f08f51dc869de3  /tmp/lion.patch' | sha256sum -c -
          git apply --index --whitespace=error /tmp/lion.patch
          test "$(git write-tree)" = "c180bb1d50f4f864692c8869a9c12229f4ce11b9"
      - name: Commit exact fast-forward candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LION Direct Cutover'
          git config user.email 'lion-direct@users.noreply.github.com'
          git commit -m 'LION: bound direct supervisor failure and retry semantics'
          test "$(git rev-parse HEAD^)" = "0e696b504233fb96b6d128e054001834cbf56650"
          test "$(git rev-parse HEAD^{tree})" = "c180bb1d50f4f864692c8869a9c12229f4ce11b9"
          test "$(git status --porcelain)" = ""
      - name: Focused architecture and failure gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile tools/lion_direct_supervisor_bridge.py tools/lion_saas_broker.py tools/lion_mission_control_v3.py tools/lion_effect_admission_broker.py tools/lion_local_intelligence_runtime.py cyber_lion/app_coordination/hybrid_gateway_extension.py cyber_lion/app_coordination/saas_handoff_extension.py cyber_lion/mission_control/supervisor_projection.py
          GITHUB_ACTIONS=true python3 -m unittest -q cyber_lion.tests.test_truth_plane_reconciliation
          python3 -m unittest -q cyber_lion.tests.test_direct_supervisor_bridge_r1 cyber_lion.tests.test_saas_broker cyber_lion.tests.test_mission_control_v3_restart_package cyber_lion.tests.test_mission_state_reset cyber_lion.tests.test_panel_channel_context_r2 cyber_lion.tests.test_thread_binding_direct_supervisor_r1 cyber_lion.tests.test_windows_control_plane_supervisor_source cyber_lion.tests.test_saas_session_bridge cyber_lion.tests.test_supervisor_projection cyber_lion.tests.test_p0_surface_closure_campaign cyber_lion.tests.test_p0_moon_seven_closure_readiness cyber_lion.tests.test_p0_moon_permission_policy_reclassification cyber_lion.tests.test_host_authority_separation
      - name: Full Cyber-Lion suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s cyber_lion/tests -p 'test_*.py' -v
      - name: Verify remote refs remain exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "cd734adc9d457702fb418b36a59f4607f147ce44"
          test "$(git ls-remote origin refs/heads/mission/lpcl-panel-direct-supervisor-r1 | cut -f1)" = "0e696b504233fb96b6d128e054001834cbf56650"
      - name: Fast-forward exact candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "c180bb1d50f4f864692c8869a9c12229f4ce11b9"
          git push origin HEAD:refs/heads/mission/lpcl-panel-direct-supervisor-r1
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)"
          echo "PUBLISHED_TREE=$(git rev-parse HEAD^{tree})"
