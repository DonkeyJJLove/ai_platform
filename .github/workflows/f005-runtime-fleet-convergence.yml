name: F005 Runtime Fleet Convergence

on:
  workflow_dispatch:
    inputs:
      expected_master:
        description: Exact live master SHA to bind
        required: true
        type: string
      expected_master_tree:
        description: Exact live master tree SHA to bind
        required: true
        type: string
      source_instance:
        description: Authoritative runtime source instance identifier
        required: true
        type: string
      status_db_path:
        description: Absolute path to durable fleet status SQLite database on lion-runtime
        required: true
        type: string
      coordination_db_path:
        description: Absolute path to durable fleet coordination SQLite database on lion-runtime
        required: true
        type: string
      reconciliation_db_path:
        description: Absolute path to durable fleet reconciliation SQLite database on lion-runtime
        required: true
        type: string
  push:
    branches:
      - control/f005-runtime-convergence
    paths:
      - .lion/control/f005-runtime-convergence.request.json

permissions:
  contents: read
  statuses: write

concurrency:
  group: f005-runtime-convergence
  cancel-in-progress: false

jobs:
  runtime-fleet-convergence:
    name: F005 Runtime Fleet Convergence Evidence
    runs-on: [self-hosted, lion-runtime]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      LION_FLEET_RUNTIME_ROOT: 'C:\Users\d2j3\Documents\LION\runtime\f005'
    steps:
      - name: Checkout trigger ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve and validate execution binding
        id: binding
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_EXPECTED_MASTER: ${{ inputs.expected_master }}
          DISPATCH_EXPECTED_MASTER_TREE: ${{ inputs.expected_master_tree }}
          DISPATCH_SOURCE_INSTANCE: ${{ inputs.source_instance }}
          DISPATCH_STATUS_DB: ${{ inputs.status_db_path }}
          DISPATCH_COORDINATION_DB: ${{ inputs.coordination_db_path }}
          DISPATCH_RECONCILIATION_DB: ${{ inputs.reconciliation_db_path }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $requestPath = '.lion/control/f005-runtime-convergence.request.json'
          $canonicalStatus = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'status.sqlite'
          $canonicalCoordination = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'coordination.sqlite'
          $canonicalReconciliation = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'reconciliation.sqlite'
          $canonicalSourceInstance = 'lion-runtime-reconciliation-source-01'

          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            $expectedMaster = $env:DISPATCH_EXPECTED_MASTER
            $expectedMasterTree = $env:DISPATCH_EXPECTED_MASTER_TREE
            $sourceInstance = $env:DISPATCH_SOURCE_INSTANCE
            $statusDb = $env:DISPATCH_STATUS_DB
            $coordinationDb = $env:DISPATCH_COORDINATION_DB
            $reconciliationDb = $env:DISPATCH_RECONCILIATION_DB
          }
          elseif ($env:EVENT_NAME -eq 'push') {
            if ($env:GITHUB_REF -ne 'refs/heads/control/f005-runtime-convergence') {
              throw "control branch substitution denied: $env:GITHUB_REF"
            }
            if ([string]::IsNullOrWhiteSpace($env:BEFORE_SHA) -or $env:BEFORE_SHA -match '^0+$') {
              throw 'initial control branch creation is not an executable request'
            }
            $changed = @(git diff --name-only $env:BEFORE_SHA $env:GITHUB_SHA)
            if ($changed.Count -ne 1 -or $changed[0] -ne $requestPath) {
              throw "sandbox trigger scope violation: expected exactly $requestPath"
            }
            if (-not (Test-Path -LiteralPath $requestPath -PathType Leaf)) {
              throw 'sandbox runtime request file missing'
            }
            try {
              $request = Get-Content -LiteralPath $requestPath -Raw | ConvertFrom-Json -ErrorAction Stop
            }
            catch {
              throw 'sandbox runtime request JSON invalid'
            }
            $required = @('schema_version','request_id','expected_master','expected_master_tree')
            $actual = @($request.PSObject.Properties.Name | Sort-Object)
            $expected = @($required | Sort-Object)
            if (($actual -join ',') -ne ($expected -join ',')) {
              throw 'sandbox runtime request schema substitution denied'
            }
            if ($request.schema_version -ne '1.0.0') {
              throw 'sandbox runtime request schema version unsupported'
            }
            if ($request.request_id -notmatch '^[0-9a-f]{64}$') {
              throw 'sandbox runtime request_id must be lowercase sha256'
            }
            if ($request.expected_master -notmatch '^[0-9a-f]{40}$') {
              throw 'sandbox runtime expected_master must be lowercase git sha'
            }
            if ($request.expected_master_tree -notmatch '^[0-9a-f]{40}$') {
              throw 'sandbox runtime expected_master_tree must be lowercase git tree sha'
            }

            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $statusUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/statuses"
            $existingStatuses = @(Invoke-RestMethod -Method Get -Headers $headers -Uri $statusUri)
            if ($existingStatuses | Where-Object { $_.context -eq 'lion/f005-runtime-trigger-consumed' }) {
              throw 'sandbox runtime request replay denied'
            }

            git fetch --no-tags origin master
            if ($LASTEXITCODE -ne 0) {
              throw 'live master fetch failed'
            }
            $liveMaster = (git rev-parse refs/remotes/origin/master).Trim()
            if ($liveMaster -ne $request.expected_master) {
              throw "live master drift denied: $liveMaster != $($request.expected_master)"
            }
            $liveTree = (git show -s --format=%T $liveMaster).Trim()
            if ($liveTree -ne $request.expected_master_tree) {
              throw "live master tree drift denied: $liveTree != $($request.expected_master_tree)"
            }

            $targetUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            $consumeBody = @{
              state = 'pending'
              context = 'lion/f005-runtime-trigger-consumed'
              description = "accepted request $($request.request_id.Substring(0,12))"
              target_url = $targetUrl
            } | ConvertTo-Json -Compress
            Invoke-RestMethod `
              -Method Post `
              -Headers $headers `
              -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
              -Body $consumeBody `
              -ContentType 'application/json'

            $expectedMaster = $request.expected_master
            $expectedMasterTree = $request.expected_master_tree
            $sourceInstance = $canonicalSourceInstance
            $statusDb = $canonicalStatus
            $coordinationDb = $canonicalCoordination
            $reconciliationDb = $canonicalReconciliation
          }
          else {
            throw "unsupported event: $env:EVENT_NAME"
          }

          "expected_master=$expectedMaster" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "expected_master_tree=$expectedMasterTree" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_instance=$sourceInstance" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "status_db=$statusDb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "coordination_db=$coordinationDb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "reconciliation_db=$reconciliationDb" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Checkout exact resolved master
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.binding.outputs.expected_master }}
          persist-credentials: false

      - name: Bind workflow to exact checked-out master and tree
        env:
          EXPECTED_MASTER: ${{ steps.binding.outputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ steps.binding.outputs.expected_master_tree }}
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -ne $env:EXPECTED_MASTER) {
            throw "master binding mismatch: checkout=$actualSha expected=$env:EXPECTED_MASTER"
          }
          $actualTree = (git show -s --format=%T HEAD).Trim()
          if ($actualTree -ne $env:EXPECTED_MASTER_TREE) {
            throw "master tree binding mismatch: checkout=$actualTree expected=$env:EXPECTED_MASTER_TREE"
          }

      - name: Publish deterministic runtime run locator
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ steps.binding.outputs.expected_master }}
        run: |
          $targetUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @{
            state = 'pending'
            context = 'lion/f005-runtime-convergence'
            description = "locator-only run $env:GITHUB_RUN_ID"
            target_url = $targetUrl
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -Uri "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/statuses/$env:STATUS_SHA" `
            -Body $body `
            -ContentType 'application/json'

      - name: Compile runtime convergence producer and verifier
        run: |
          python -m compileall -q `
            cyber_lion/contracts/fleet_runtime_snapshot_source.py `
            cyber_lion/enterprise/fleet_runtime_snapshot_source.py `
            cyber_lion/contracts/fleet_runtime_convergence.py `
            cyber_lion/enterprise/fleet_runtime_convergence.py

      - name: Run runtime convergence source and verifier tests
        run: |
          python -m unittest cyber_lion.tests.test_fleet_runtime_snapshot_source -v
          python -m unittest cyber_lion.tests.test_fleet_runtime_convergence -v

      - name: Require authoritative runtime stores
        env:
          STATUS_DB: ${{ steps.binding.outputs.status_db }}
          COORDINATION_DB: ${{ steps.binding.outputs.coordination_db }}
          RECONCILIATION_DB: ${{ steps.binding.outputs.reconciliation_db }}
        run: |
          $expected = @{
            status = (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'status.sqlite')
            coordination = (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'coordination.sqlite')
            reconciliation = (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'reconciliation.sqlite')
          }
          foreach ($entry in @(
            @{ Name = 'status'; Path = $env:STATUS_DB },
            @{ Name = 'coordination'; Path = $env:COORDINATION_DB },
            @{ Name = 'reconciliation'; Path = $env:RECONCILIATION_DB }
          )) {
            if ($entry.Path -ne $expected[$entry.Name]) {
              throw "$($entry.Name) runtime source path substitution denied: $($entry.Path)"
            }
            if (-not [System.IO.Path]::IsPathFullyQualified($entry.Path)) {
              throw "$($entry.Name) runtime source path is not absolute: $($entry.Path)"
            }
            if (-not (Test-Path -LiteralPath $entry.Path -PathType Leaf)) {
              throw "$($entry.Name) authoritative runtime source not found: $($entry.Path)"
            }
          }

      - name: Materialize authoritative runtime convergence snapshot
        env:
          EXPECTED_MASTER: ${{ steps.binding.outputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ steps.binding.outputs.expected_master_tree }}
          SOURCE_INSTANCE: ${{ steps.binding.outputs.source_instance }}
          STATUS_DB: ${{ steps.binding.outputs.status_db }}
          COORDINATION_DB: ${{ steps.binding.outputs.coordination_db }}
          RECONCILIATION_DB: ${{ steps.binding.outputs.reconciliation_db }}
        run: |
          $snapshotPath = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'fleet-convergence-snapshot.json'
          python -m cyber_lion.enterprise.fleet_runtime_snapshot_source `
            --repository "DonkeyJJLove/ai_platform" `
            --expected-master "$env:EXPECTED_MASTER" `
            --expected-master-tree "$env:EXPECTED_MASTER_TREE" `
            --source-instance "$env:SOURCE_INSTANCE" `
            --status-db "$env:STATUS_DB" `
            --coordination-db "$env:COORDINATION_DB" `
            --reconciliation-db "$env:RECONCILIATION_DB" `
            --output "$snapshotPath"
          if (-not (Test-Path -LiteralPath $snapshotPath -PathType Leaf)) {
            throw "authoritative runtime snapshot was not materialized"
          }

      - name: Verify authoritative runtime convergence snapshot
        env:
          EXPECTED_MASTER: ${{ steps.binding.outputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ steps.binding.outputs.expected_master_tree }}
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "f005-runtime-convergence-receipt.json"
          $snapshotPath = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'fleet-convergence-snapshot.json'
          python -m cyber_lion.enterprise.fleet_runtime_convergence `
            --snapshot "$snapshotPath" `
            --repository "DonkeyJJLove/ai_platform" `
            --expected-master "$env:EXPECTED_MASTER" `
            --expected-master-tree "$env:EXPECTED_MASTER_TREE" `
            --max-age-seconds 300 | Tee-Object -FilePath $receipt

      - name: Publish receipt to step summary
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "f005-runtime-convergence-receipt.json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### F005 Runtime Fleet Convergence'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
          Get-Content -LiteralPath $receipt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
