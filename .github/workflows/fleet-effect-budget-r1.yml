name: Fleet Aggregate Effect Budget R1

on:
  push:
    branches:
      - mission/fleet-aggregate-effect-budget-r1
    paths:
      - "cyber_lion/contracts/fleet_effect_budget.py"
      - "cyber_lion/enterprise/fleet_effect_budget.py"
      - "cyber_lion/enterprise/repository_mutation_pep.py"
      - "cyber_lion/tests/test_fleet_effect_budget_contract.py"
      - "cyber_lion/tests/test_fleet_effect_budget.py"
      - "cyber_lion/tests/test_repository_mutation_pep.py"
      - "cyber_lion/tests/test_startup_cli.py"
      - "cyber_lion/CONTRACT_MAP.md"
      - "cyber_lion/CAPABILITY_MAP.md"
      - "LION/architecture/implementation-map.json"
      - "cyber_lion/tests/test_fleet_effect_budget_claim_materialization.py"
      - ".github/workflows/fleet-effect-budget-r1.yml"
  pull_request:
    paths:
      - "cyber_lion/contracts/fleet_effect_budget.py"
      - "cyber_lion/enterprise/fleet_effect_budget.py"
      - "cyber_lion/enterprise/repository_mutation_pep.py"
      - "cyber_lion/tests/test_fleet_effect_budget_contract.py"
      - "cyber_lion/tests/test_fleet_effect_budget.py"
      - "cyber_lion/tests/test_repository_mutation_pep.py"
      - "cyber_lion/tests/test_startup_cli.py"
      - "cyber_lion/CONTRACT_MAP.md"
      - "cyber_lion/CAPABILITY_MAP.md"
      - "LION/architecture/implementation-map.json"
      - "cyber_lion/tests/test_fleet_effect_budget_claim_materialization.py"
      - ".github/workflows/fleet-effect-budget-r1.yml"

permissions:
  contents: read

jobs:
  fleet-effect-budget-r1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Exact successor identity and digests
        shell: bash
        run: |
          set -euo pipefail
          BASE='8bf8934a0cf2809b58b460c01976cf82ae0692e7'
          ACTUAL="$(git rev-parse HEAD)"
          TREE="$(git rev-parse HEAD^{tree})"
          git merge-base --is-ancestor "$BASE" "$ACTUAL"
          CONTRACT_DIGEST="$(sha256sum cyber_lion/contracts/fleet_effect_budget.py | awk '{print $1}')"
          IMPLEMENTATION_DIGEST="$(sha256sum cyber_lion/enterprise/fleet_effect_budget.py | awk '{print $1}')"
          mapfile -t CHANGED < <(git diff --name-only "$BASE".."$ACTUAL" | sort)
          if [ "${#CHANGED[@]}" -eq 0 ]; then
            echo 'CHANGED_FILES_EMPTY=YES' >&2
            exit 1
          fi
          CHANGED_JOINED="$(IFS=,; echo "${CHANGED[*]}")"
          printf 'CONTRACT_DIGEST=%s\n' "$CONTRACT_DIGEST"
          printf 'IMPLEMENTATION_DIGEST=%s\n' "$IMPLEMENTATION_DIGEST"
          printf 'CHANGED_FILES=%s\n' "$CHANGED_JOINED"
          printf 'SUCCESSOR_HEAD=%s\n' "$ACTUAL"
          printf 'SUCCESSOR_TREE=%s\n' "$TREE"
      - name: Compile Cyber-Lion
        run: python -m compileall -q cyber_lion
      - name: Verified claim materialization regression
        run: |
          set -euo pipefail
          python -m unittest cyber_lion.tests.test_fleet_effect_budget_claim_materialization -v
          echo 'VERIFIED_CLAIM_MAP_TESTS=PASS'
      - name: Startup CLI deterministic freshness regression
        run: |
          set -euo pipefail
          python -m unittest cyber_lion.tests.test_startup_cli -v
          echo 'TARGETED_STARTUP_CLI=PASS'
      - name: Fleet effect budget contract tests
        run: |
          set -euo pipefail
          python -m unittest cyber_lion.tests.test_fleet_effect_budget_contract -v
          echo 'FLEET_EFFECT_BUDGET_CONTRACT_TESTS=PASS'
      - name: Fleet effect budget concurrency and fail-closed tests
        run: |
          set -euo pipefail
          python -m unittest cyber_lion.tests.test_fleet_effect_budget -v
          echo 'FLEET_EFFECT_BUDGET_CONCURRENCY_TESTS=PASS'
          echo 'FLEET_EFFECT_BUDGET_REPLAY_TESTS=PASS'
          echo 'FLEET_EFFECT_BUDGET_FAIL_CLOSED_TESTS=PASS'
      - name: Repository mutation budget integration
        run: |
          set -euo pipefail
          python -m unittest cyber_lion.tests.test_repository_mutation_pep -v
          echo 'REPOSITORY_MUTATION_BUDGET_BINDING_TESTS=PASS'
          echo 'AUTHORITY_AMPLIFICATION_TEST=PASS_DENIED'
          echo 'BUDGET_WITHOUT_AUTHORITY_TEST=PASS_DENIED'
          echo 'CONCURRENT_OVERCOMMIT_TEST=PASS_DENIED'
          echo 'EXACT_LIMIT_TEST=PASS'
      - name: Slice terminal
        run: |
          echo 'AUTHORITY_ISSUED=NO'
          echo 'LAB_MUTATED=NO'
          echo 'MERGE_ATTEMPTED=NO'
