name: LION LPCL SentinelX Operator Bus Publisher R1
on:
  push:
    branches: [bootstrap/lion-lpcl-sentinelx-bus-r1]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cd734adc9d457702fb418b36a59f4607f147ce44
          fetch-depth: 0
      - name: Verify exact master substrate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "cd734adc9d457702fb418b36a59f4607f147ce44"
          test "$(git rev-parse HEAD^{tree})" = "947c1af8e90cdc8fce054c21a8255b6e2222fc43"
          test "$(git status --porcelain)" = ""
      - name: Materialize exact SentinelX operator-bus candidate
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS 'https://drop.pensa.ar/f/o72ZN99dTDvhG/lion-lpcl-sentinelx-bus-final-publish.patch.gz' -o /tmp/lion-bus.patch.gz
          echo 'ba968858bc0d706643d4b26e2c09740ef21ae549d737968cd9eac10426a9835e  /tmp/lion-bus.patch.gz' | sha256sum -c -
          gzip -dc /tmp/lion-bus.patch.gz > /tmp/lion-bus.patch
          echo 'c7bf6a2805a1b74ec581fe2e87451118755f671134622aff05d6b29c1f9ba790  /tmp/lion-bus.patch' | sha256sum -c -
          git apply --index --whitespace=error /tmp/lion-bus.patch
          test "$(git write-tree)" = "e2a58e8f6cf025f99bc29d21607db17799bd040a"
      - name: Reject abandoned API and browser-mediated production path
        shell: bash
        run: |
          set -euo pipefail
          files=$(git diff --name-only cd734adc9d457702fb418b36a59f4607f147ce44 --cached | grep -v '^cyber_lion/tests/' || true)
          for p in $files; do
            test -f "$p" || continue
            if grep -qE 'OPENAI_RESPONSES_API_MEDIATED|OPENAI_API_KEY|lion_direct_supervisor_bridge|127\.0\.0\.1:8768|CHATGPT_FIREFOX_PROJECT_MEDIATED' "$p"; then
              echo "FORBIDDEN_PRODUCTION_DIRECTION:$p"
              exit 1
            fi
          done
      - name: Commit exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'LION Operator Bus'
          git config user.email 'lion-operator-bus@users.noreply.github.com'
          git commit -m 'LION: route LPCL panel through shared SentinelX operator bus'
          test "$(git rev-parse HEAD^)" = "cd734adc9d457702fb418b36a59f4607f147ce44"
          test "$(git rev-parse HEAD^{tree})" = "e2a58e8f6cf025f99bc29d21607db17799bd040a"
          test "$(git status --porcelain)" = ""
      - name: Focused shared-bus gates
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            cyber_lion/mission_control/operator_control.py \
            cyber_lion/app_coordination/local_intelligence_gateway.py \
            cyber_lion/app_coordination/hybrid_gateway_extension.py \
            tools/lion_local_intelligence_runtime.py \
            tools/lion_operator_client.py \
            tools/lion_effect_admission_broker.py
          GITHUB_ACTIONS=true python3 -m unittest -q cyber_lion.tests.test_truth_plane_reconciliation
          python3 -m unittest -q \
            cyber_lion.tests.test_saas_session_bridge \
            cyber_lion.tests.test_operator_bus_panel_r1 \
            cyber_lion.tests.test_lpcl_panel_operator_bus_r1 \
            cyber_lion.tests.test_operator_control \
            cyber_lion.tests.test_operator_worker_delivery \
            cyber_lion.tests.test_mission_control_v3_restart_package \
            cyber_lion.tests.test_p0_surface_closure_campaign \
            cyber_lion.tests.test_p0_moon_seven_closure_readiness \
            cyber_lion.tests.test_p0_moon_permission_policy_reclassification \
            cyber_lion.tests.test_p0_moon_same_connection_denial_carrier \
            cyber_lion.tests.test_p0_moon_seven_binding_chain \
            cyber_lion.tests.test_p0_moon_readonly_observer_falsification_runtime \
            cyber_lion.tests.test_p0_moon_runner_attested_execution_bridge \
            cyber_lion.tests.test_host_authority_separation
          python3 - <<'PY'
          from cyber_lion.app_coordination import local_intelligence_gateway as g
          ui=g.UI
          for forbidden in ('LION Local + SaaS Supervisor','refreshFirefoxMediator','pollSaas','127.0.0.1:8790'):
              assert forbidden not in ui, forbidden
          assert 'LION BUS' in ui
          assert 'SUPERSEDED_BY_LION_BUS' in open(g.__file__,encoding='utf-8').read()
          PY
      - name: Full Cyber-Lion suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s cyber_lion/tests -p 'test_*.py' -v
      - name: Verify remote refs remain exact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/master | cut -f1)" = "cd734adc9d457702fb418b36a59f4607f147ce44"
          if git ls-remote --exit-code --heads origin refs/heads/mission/lpcl-panel-sentinelx-operator-bus-r1 >/tmp/target-ref; then
            echo TARGET_BRANCH_ALREADY_EXISTS
            cat /tmp/target-ref
            exit 1
          fi
      - name: Publish exact candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "e2a58e8f6cf025f99bc29d21607db17799bd040a"
          git push origin HEAD:refs/heads/mission/lpcl-panel-sentinelx-operator-bus-r1
          echo "PUBLISHED_HEAD=$(git rev-parse HEAD)"
          echo "PUBLISHED_TREE=$(git rev-parse HEAD^{tree})"
