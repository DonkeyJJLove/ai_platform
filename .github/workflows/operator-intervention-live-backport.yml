name: LION Operator Intervention Live Hardening Backport

on:
  push:
    branches:
      - mission/operator-intervention-r1
    paths:
      - .github/workflows/operator-intervention-live-backport.yml

permissions:
  contents: write

jobs:
  backport-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Apply exact live hardening
        run: python .github/operator-intervention/live_backport.py
      - name: Verify diff and layering
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python - <<'PY'
          import ast
          from pathlib import Path
          p=Path('tools/lion_local_intelligence_runtime.py')
          bad=[]
          for node in ast.walk(ast.parse(p.read_text(encoding='utf-8'))):
              if isinstance(node,ast.Import): names=[a.name for a in node.names]
              elif isinstance(node,ast.ImportFrom): names=[node.module or '']
              else: continue
              bad.extend(n for n in names if n.startswith('cyber_lion.mission_control'))
          if bad: raise SystemExit('LOCAL_RUNTIME_AUTHORITY_IMPORT='+','.join(sorted(set(bad))))
          print('LOCAL_RUNTIME_AUTHORITY_IMPORT=NONE')
          PY
      - name: Compile control surfaces
        run: python -m compileall -q cyber_lion tools/lion_local_intelligence_runtime.py tools/lion_effect_admission_broker.py
      - name: Run operator intervention regression gate
        run: |
          python -m unittest \
            cyber_lion.tests.test_operator_full_sat \
            cyber_lion.tests.test_operator_provision \
            cyber_lion.tests.test_operator_effect_boundary \
            cyber_lion.tests.test_operator_control \
            cyber_lion.tests.test_operator_client \
            cyber_lion.tests.test_operator_privileged_deploy \
            cyber_lion.tests.test_operator_panel_security \
            cyber_lion.tests.test_operator_gateway \
            cyber_lion.tests.test_operator_containment_helper \
            cyber_lion.tests.test_operator_backpressure \
            cyber_lion.tests.test_operator_worker_delivery \
            cyber_lion.tests.test_operator_capability_registry \
            cyber_lion.tests.test_scheduler_storage_reconciliation \
            cyber_lion.tests.test_local_assignment_worker \
            cyber_lion.tests.test_mission_control_v3_restart_package
      - name: Commit tested live-hardening state
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/operator-intervention/live_backport.py
          rm -f .github/workflows/operator-intervention-live-backport.yml
          rmdir .github/operator-intervention 2>/dev/null || true
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'LION operator intervention: backport deployed fail-closed hardening'
          git push origin HEAD:mission/operator-intervention-r1
