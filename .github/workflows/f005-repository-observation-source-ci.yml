name: F005-K Repository Observation Source CI

on:
  pull_request:
    paths:
      - 'cyber_lion/contracts/fleet_repository_observation_source.py'
      - 'cyber_lion/enterprise/fleet_repository_observation_source.py'
      - 'cyber_lion/tests/test_fleet_repository_observation_source.py'
      - '.github/workflows/f005-repository-observation-source-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observation-source-ci:
    name: F005-K Repository Observation Source
    runs-on: ubuntu-latest
    env:
      LION_FLEET_RUNTIME_ROOT: 'C:\Users\d2j3\Documents\LION\runtime\f005'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Compile F005-K slice
        run: |
          python -m compileall -q \
            cyber_lion/contracts/fleet_repository_observation_source.py \
            cyber_lion/enterprise/fleet_repository_observation_source.py
      - name: Run F005-K regressions
        run: |
          python -m unittest cyber_lion.tests.test_fleet_repository_observation_source -v
      - name: Verify no runtime observation materialized in CI
        shell: bash
        run: |
          target="${LION_FLEET_RUNTIME_ROOT}\\reconciliation-source\\repository-"
          target+='inventory.json'
          if test -e "$target"; then
            echo "FAIL: runtime observation materialized during CI: $target" >&2
            exit 1
          fi
          echo "PASS: runtime observation absent"
      - name: Verify GitHubReadSource interface present
        shell: bash
        run: |
          if ! grep -Fq 'class GitHubReadSource' cyber_lion/enterprise/fleet_repository_observation_source.py; then
            echo 'FAIL: GitHubReadSource interface missing' >&2
            exit 1
          fi
          echo 'PASS: GitHubReadSource interface present'
      - name: Verify AuthoritativeOwnershipProvider interface present
        shell: bash
        run: |
          if ! grep -Fq 'class AuthoritativeOwnershipProvider' cyber_lion/enterprise/fleet_repository_observation_source.py; then
            echo 'FAIL: AuthoritativeOwnershipProvider interface missing' >&2
            exit 1
          fi
          echo 'PASS: AuthoritativeOwnershipProvider interface present'
      - name: Verify CI workflow does not invoke observation materialization
        shell: bash
        run: |
          workflow='.github/workflows/f005-repository-observation-source-ci.yml'
          module='python -m cyber_lion.enterprise.'
          module+='fleet_repository_observation_source'
          output='repository-'
          output+='inventory.json'
          if grep -Fq "$module" "$workflow"; then
            echo "FAIL: CI workflow invokes observation producer module" >&2
            exit 1
          fi
          if grep -Fq "$output" "$workflow"; then
            echo "FAIL: CI workflow contains runtime observation output literal" >&2
            exit 1
          fi
          echo 'PASS: CI workflow cannot materialize runtime observation'
