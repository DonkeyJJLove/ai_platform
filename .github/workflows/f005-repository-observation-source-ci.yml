name: F005-K Repository Observation Source CI

on:
  pull_request:
    paths:
      - 'cyber_lion/contracts/fleet_repository_observation_source.py'
      - 'cyber_lion/enterprise/fleet_repository_observation_source.py'
      - 'cyber_lion/enterprise/github_repository_read_source.py'
      - 'cyber_lion/enterprise/fleet_repository_observation_runtime.py'
      - 'cyber_lion/tests/test_fleet_repository_observation_source.py'
      - 'cyber_lion/tests/test_github_repository_read_source.py'
      - 'cyber_lion/tests/test_fleet_repository_observation_runtime.py'
      - '.github/workflows/f005-repository-observation-source-ci.yml'
      - '.github/workflows/f005-runtime-repository-observation.yml'
  workflow_dispatch:

concurrency:
  group: f005-repository-observation-source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  observation-source-ci:
    name: F005-K Repository Observation Source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LION_FLEET_RUNTIME_ROOT: 'C:\Users\d2j3\Documents\LION\runtime\f005'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Bind exact checkout identity
        id: gitstate
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          actual_head="$(git rev-parse HEAD)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$actual_head" = "$EXPECTED_HEAD"
          printf 'F005_CHECKED_OUT_HEAD=%s\n' "$actual_head"
          printf 'F005_CHECKED_OUT_TREE=%s\n' "$actual_tree"
          echo "head=$actual_head" >> "$GITHUB_OUTPUT"
          echo "tree=$actual_tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Compile F005-K and K2 slices
        run: |
          python -m compileall -q \
            cyber_lion/contracts/fleet_repository_observation_source.py \
            cyber_lion/enterprise/fleet_repository_observation_source.py \
            cyber_lion/enterprise/github_repository_read_source.py \
            cyber_lion/enterprise/fleet_repository_observation_runtime.py

      - name: Run F005-K and K2 regressions
        run: |
          python -m unittest \
            cyber_lion.tests.test_fleet_repository_observation_source \
            cyber_lion.tests.test_github_repository_read_source \
            cyber_lion.tests.test_fleet_repository_observation_runtime \
            -v

      - name: Verify no runtime observation materialized in CI
        shell: bash
        run: |
          if find . -name 'repository-inventory.json' -print -quit | grep -q .; then
            echo 'FAIL: runtime observation materialized during CI' >&2
            exit 1
          fi
          echo 'PASS: runtime observation absent'

      - name: Verify concrete read-only adapter present
        shell: bash
        run: |
          adapter='cyber_lion/enterprise/github_repository_read_source.py'
          grep -Fq 'class GitHubRESTReadSource' "$adapter"
          grep -Fq 'class UrllibReadOnlyTransport' "$adapter"
          if grep -Eq 'def (post|put|patch|delete)\(' "$adapter"; then
            echo 'FAIL: mutation method exposed by GitHub adapter' >&2
            exit 1
          fi
          echo 'PASS: concrete GET-only GitHub adapter present'

      - name: Verify ownership provider composition present
        shell: bash
        run: |
          runtime='cyber_lion/enterprise/fleet_repository_observation_runtime.py'
          grep -Fq 'FileBranchOwnershipRegistryProvider' "$runtime"
          grep -Fq 'GitHubRESTReadSource.from_environment' "$runtime"
          echo 'PASS: runtime composition uses live GitHub source and file ownership provider'

      - name: Verify runtime checkout does not persist credentials
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/f005-runtime-repository-observation.yml').read_text(encoding='utf-8')
          lines = workflow.splitlines()
          checkout_indexes = [
              index for index, line in enumerate(lines)
              if line.strip() == '- uses: actions/checkout@v6'
          ]
          if len(checkout_indexes) != 1:
              raise SystemExit('FAIL: runtime workflow must contain exactly one checkout@v6 step')
          start = checkout_indexes[0]
          base_indent = len(lines[start]) - len(lines[start].lstrip())
          block = []
          for line in lines[start + 1:]:
              stripped = line.strip()
              indent = len(line) - len(line.lstrip())
              if stripped.startswith('- ') and indent <= base_indent:
                  break
              block.append(stripped)
          if 'persist-credentials: false' not in block:
              raise SystemExit('FAIL: runtime checkout must set persist-credentials: false')
          print('PASS: runtime checkout credential persistence disabled')
          PY

      - name: Verify CI workflow cannot invoke runtime observation materialization
        shell: bash
        run: |
          workflow='.github/workflows/f005-repository-observation-source-ci.yml'
          module='python -m cyber_lion.enterprise.'
          module+='fleet_repository_observation_runtime'
          if grep -Fq "$module" "$workflow"; then
            echo 'FAIL: CI workflow invokes runtime observation module' >&2
            exit 1
          fi
          echo 'PASS: CI workflow cannot materialize runtime observation'
