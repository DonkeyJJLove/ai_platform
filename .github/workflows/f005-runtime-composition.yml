name: F005 Runtime Composition

on:
  workflow_dispatch:
    inputs:
      expected_master:
        description: Exact live master SHA to bind
        required: true
        type: string
      expected_master_tree:
        description: Exact live master tree SHA to bind
        required: true
        type: string
      composition_instance:
        description: Runtime composition instance identifier
        required: true
        type: string
      registry_instance:
        description: Fleet status registry instance identifier
        required: true
        type: string
      coordinator_instance:
        description: Fleet coordination instance identifier
        required: true
        type: string
      pins_file:
        description: Absolute external path to the canonical F005-H trust pins JSON file
        required: true
        type: string

permissions:
  contents: read

jobs:
  runtime-composition:
    name: F005 Runtime Composition Root
    runs-on: [self-hosted, lion-runtime]
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      LION_FLEET_RUNTIME_ROOT: 'C:\Users\d2j3\Documents\LION\runtime\f005'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Bind workflow to exact checked-out master and tree
        env:
          EXPECTED_MASTER: ${{ inputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ inputs.expected_master_tree }}
        run: |
          if ($env:GITHUB_SHA -ne $env:EXPECTED_MASTER) {
            throw "master binding mismatch: checkout=$env:GITHUB_SHA expected=$env:EXPECTED_MASTER"
          }
          $actualTree = (git show -s --format=%T HEAD).Trim()
          if ($actualTree -ne $env:EXPECTED_MASTER_TREE) {
            throw "master tree binding mismatch: checkout=$actualTree expected=$env:EXPECTED_MASTER_TREE"
          }

      - name: Compile runtime composition
        run: |
          python -m compileall -q `
            cyber_lion/contracts/fleet_runtime_composition.py `
            cyber_lion/enterprise/fleet_runtime_composition.py

      - name: Run runtime composition regressions
        run: |
          python -m unittest cyber_lion.tests.test_fleet_runtime_composition -v

      - name: Bootstrap or reopen canonical durable stores
        env:
          EXPECTED_MASTER: ${{ inputs.expected_master }}
          EXPECTED_MASTER_TREE: ${{ inputs.expected_master_tree }}
          COMPOSITION_INSTANCE: ${{ inputs.composition_instance }}
          REGISTRY_INSTANCE: ${{ inputs.registry_instance }}
          COORDINATOR_INSTANCE: ${{ inputs.coordinator_instance }}
          PINS_FILE: ${{ inputs.pins_file }}
        run: |
          $expectedPins = Join-Path $env:LION_FLEET_RUNTIME_ROOT 'trust\f005-h-pins.json'
          if ($env:PINS_FILE -ne $expectedPins) {
            throw "runtime trust pins path mismatch: actual=$env:PINS_FILE expected=$expectedPins"
          }

          $receipt = Join-Path $env:RUNNER_TEMP "f005-runtime-composition-receipt.json"
          $bootstrap = @'
          import os
          from pathlib import Path
          import runpy
          import sys

          pins_path = Path(os.environ["PINS_FILE"])
          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()

          if not pins_path.is_absolute():
              raise SystemExit("runtime trust pins path must be absolute")
          if not pins_path.is_file():
              raise SystemExit("runtime trust pins file missing or not a regular file")

          resolved = pins_path.resolve()
          try:
              resolved.relative_to(workspace)
          except ValueError:
              pass
          else:
              raise SystemExit("runtime trust pins file must be outside repository workspace")

          try:
              pins_json = pins_path.read_bytes().decode("utf-8")
          except UnicodeDecodeError as exc:
              raise SystemExit("runtime trust pins file is not UTF-8") from exc

          sys.argv = [
              "fleet_runtime_composition",
              "--repository", "DonkeyJJLove/ai_platform",
              "--expected-master", os.environ["EXPECTED_MASTER"],
              "--expected-master-tree", os.environ["EXPECTED_MASTER_TREE"],
              "--composition-instance", os.environ["COMPOSITION_INSTANCE"],
              "--registry-instance", os.environ["REGISTRY_INSTANCE"],
              "--coordinator-instance", os.environ["COORDINATOR_INSTANCE"],
              "--pins-json", pins_json,
          ]
          runpy.run_module("cyber_lion.enterprise.fleet_runtime_composition", run_name="__main__")
          '@

          $bootstrap | python - | Tee-Object -FilePath $receipt
          if ($LASTEXITCODE -ne 0) {
            throw "runtime composition bootstrap failed"
          }

      - name: Verify F005-G compatible runtime store paths
        run: |
          foreach ($path in @(
            (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'status.sqlite'),
            (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'coordination.sqlite'),
            (Join-Path $env:LION_FLEET_RUNTIME_ROOT 'reconciliation.sqlite')
          )) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "canonical runtime store missing after composition: $path"
            }
          }

      - name: Publish composition receipt
        run: |
          $receipt = Join-Path $env:RUNNER_TEMP "f005-runtime-composition-receipt.json"
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '### F005 Runtime Composition'
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```json'
          Get-Content -LiteralPath $receipt | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value '```'
