name: LION Operator Intervention Finalizer

on:
  push:
    branches:
      - mission/operator-intervention-r1
    paths:
      - .github/workflows/operator-intervention-finalize.yml

permissions:
  contents: write

concurrency:
  group: lion-operator-intervention-finalizer
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trigger commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Reconstruct and verify exact patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/operator-intervention/final.patch.xz.b64.part1 \
            .github/operator-intervention/final.patch.xz.b64.part2 \
            .github/operator-intervention/final.patch.xz.b64.part3 \
            > /tmp/lion-operator-final.b64
          test "$(wc -c < /tmp/lion-operator-final.b64)" = "48380"
          test "$(sha256sum /tmp/lion-operator-final.b64 | awk '{print $1}')" = "6e38faefdaf7d597d307b8f2e0c19c64eeb0bba0b6afa074b3416de9625e5ee4"
          base64 -d /tmp/lion-operator-final.b64 | xz -d > /tmp/lion-operator-final.patch
          test "$(wc -c < /tmp/lion-operator-final.patch)" = "221949"
          test "$(sha256sum /tmp/lion-operator-final.patch | awk '{print $1}')" = "62dfb35cc4eb966937b4e8d2fa26f7b78930317c8a2c48d4c3a4859f39f88768"
          git apply --check /tmp/lion-operator-final.patch
          git apply /tmp/lion-operator-final.patch

      - name: Remove one-shot transport artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/operator-intervention
          rm -f .github/workflows/operator-intervention-finalize.yml
          git diff --check

      - name: Compile authority and execution boundary modules
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m py_compile \
            cyber_lion/contracts/operator_intervention.py \
            cyber_lion/mission_control/operator_control.py \
            cyber_lion/mission_control/global_scheduler.py \
            cyber_lion/app_coordination/local_intelligence_gateway.py \
            tools/lion_operator_gateway.py \
            tools/lion_operator_client.py \
            tools/lion_operator_containment_helper.py \
            tools/lion_operator_provision.py \
            tools/lion_local_intelligence_runtime.py \
            tools/lion_mission_control_v3.py \
            tools/lion_effect_admission_broker.py

      - name: Run operator intervention contract regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m unittest \
            cyber_lion.tests.test_operator_control \
            cyber_lion.tests.test_operator_gateway \
            cyber_lion.tests.test_operator_full_sat \
            cyber_lion.tests.test_operator_effect_boundary \
            cyber_lion.tests.test_operator_panel_security \
            cyber_lion.tests.test_operator_worker_delivery \
            cyber_lion.tests.test_operator_client \
            cyber_lion.tests.test_operator_containment_helper \
            cyber_lion.tests.test_operator_backpressure \
            cyber_lion.tests.test_operator_capability_registry \
            cyber_lion.tests.test_local_assignment_worker \
            cyber_lion.tests.test_scheduler_storage_reconciliation \
            cyber_lion.tests.test_mission_control_v3_restart_package

      - name: Prove exact final tree and fast-forward branch
        shell: bash
        env:
          EXPECTED_TREE: 3dd08f85032a23b626d558aa9620c3778b87f016
          TARGET_REF: refs/heads/mission/operator-intervention-r1
        run: |
          set -euo pipefail
          TRIGGER_SHA="$GITHUB_SHA"
          git add -A
          TREE="$(git write-tree)"
          printf 'TRIGGER_SHA=%s\nFINAL_TREE=%s\n' "$TRIGGER_SHA" "$TREE"
          test "$TREE" = "$EXPECTED_TREE"
          git config user.name "LION Automation"
          git config user.email "lion-automation@users.noreply.github.com"
          FINAL_COMMIT="$(printf '%s\n' 'LION: finalize operator intervention R1 exact tree' | git commit-tree "$TREE" -p "$TRIGGER_SHA")"
          git push origin "$FINAL_COMMIT:$TARGET_REF"
          printf 'FINAL_COMMIT=%s\n' "$FINAL_COMMIT"
