name: LION MOON Runner Attested Execution Bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Exact bounded MOON operation
        required: true
        type: choice
        options:
          - OBSERVE_SCHEMA
          - OBSERVE_SAME_CONNECTION_PRAGMA
          - DENY_WRONG_EXPECTED_STATE
          - DENY_REPLAYED_EFFECT_KEY
          - DENY_REPOSITORY_SUBSTITUTION
          - DENY_ACTOR_SUBSTITUTION
          - DENY_CONTROL_ISSUE_SUBSTITUTION

permissions:
  contents: read

jobs:
  execute-operation:
    runs-on: [self-hosted, linux, lion-trust-client]
    timeout-minutes: 5
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Execute exact runner-attested operation
        run: python3 -m tools.p0_moon_runner_attested_execution_bridge --operation '${{ inputs.operation }}'
