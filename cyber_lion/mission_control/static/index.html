<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LION Mission Control</title><link rel="stylesheet" href="app.css"></head>
<body><main><header><div><h1>LION Mission Control</h1><p class="sub">Global read-only test observability plane</p></div><div id="health" class="pill">connecting…</div></header>
<section id="summary" class="cards"></section>
<section class="panel"><div class="panel-head"><h2>Runs</h2><div><select id="adapter"><option value="">All adapters</option></select><select id="status"><option value="">All statuses</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Status</th><th>Run ID</th><th>Process class</th><th>Adapter</th><th>Host</th><th>Runtime</th><th>Target</th><th>Phase</th><th>Started</th><th>Duration</th></tr></thead><tbody id="runs"></tbody></table></div></section>
<section class="panel"><h2>Run detail</h2><div id="empty">Select a run.</div><div id="detail" hidden><div class="detail-grid"><div><h3>Identity</h3><pre id="identity"></pre></div><div><h3>Source</h3><pre id="source"></pre></div><div><h3>Target</h3><pre id="target"></pre></div><div><h3>Authority</h3><pre id="authority"></pre></div></div><h3>Timeline / Events</h3><pre id="events"></pre><div class="detail-grid"><div><h3>Metrics</h3><pre id="metrics"></pre></div><div><h3>Participants</h3><pre id="participants"></pre></div><div><h3>Artifacts</h3><pre id="artifacts"></pre></div><div><h3>Receipts</h3><pre id="receipts"></pre></div></div><h3>Cleanup / Verification</h3><pre id="verification"></pre></div></section>
</main><script src="app.js"></script></body></html>
